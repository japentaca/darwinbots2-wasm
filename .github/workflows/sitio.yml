# Sitio darwinbots-wasm.org en Cloudflare Pages (port/web2/PLAN-SITIO.md S1-S3):
#  - raíz:         portada (port/sitio/publico/).
#  - /manual/:     el manual (port/sitio/generar.mjs: .md de port/sitio/manual/
#                  más la referencia generada de spec/ y engine/opciones.js).
#  - /en/, /en/manual/: la portada y el manual en inglés.
#  - /app/:        la interfaz nueva (port/web2, build de Vite con base './').
#  - /classic/:    la clásica (port/web/, congelada, sin cambios en sus fuentes).
#  - /build-wasm/: dbcore.js + dbcore.wasm, compilados una sola vez y
#                  compartidos (classic/worker.js carga ../build-wasm/dbcore.js;
#                  la nueva pide ../build-wasm/dbcore.js?v=<commit>).
# El armado vive en port/web2/scripts/armar-sitio.sh para probarlo igual en local.
# Solo despliega un push a main: los secretos de Cloudflare están en el
# entorno «produccion», que solo acepta la rama main. Nunca pull_request_target.
name: Sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Instalar emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Compilar dbcore.js + dbcore.wasm
        working-directory: port
        run: |
          cmake --preset wasm
          cmake --build --preset wasm --target dbcore_wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: port/web2/package-lock.json
      - name: Compilar la interfaz nueva (Vite)
        working-directory: port/web2
        # DB_BUILD_ID (C4) versiona los pedidos a dbcore.js/dbcore.wasm.
        run: |
          npm ci
          DB_BUILD_ID="${GITHUB_SHA::7}" npx vite build
      - name: Armar el sitio (portada, manual/, app/, classic/, build-wasm/)
        # Incluye el versionado de la clásica (cache busting con ?v=<commit>) y
        # el manual: falla con enlaces rotos, referencia incompleta o un bloque
        # adn con avisos del lint.
        run: sh port/web2/scripts/armar-sitio.sh site "${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: site
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://darwinbots-wasm.org
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: site
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=darwinbots-wasm --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
