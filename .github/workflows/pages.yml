# Demo viva en GitHub Pages: compila el preset wasm y publica port/web/ +
# los artefactos dbcore.js/dbcore.wasm conservando el layout relativo que la
# página espera (web/worker.js carga ../build-wasm/dbcore.js).
# Requiere habilitar Pages en el repo con Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Instalar emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Compilar dbcore.js + dbcore.wasm
        working-directory: port
        run: |
          cmake --preset wasm
          cmake --build --preset wasm --target dbcore_wasm
      - name: Armar el sitio (web/ + build-wasm/, mismo layout que en el repo)
        run: |
          mkdir -p site/build-wasm
          cp -r port/web site/web
          cp port/build-wasm/dbcore.js port/build-wasm/dbcore.wasm site/build-wasm/
      - name: Versionar los scripts (cache busting)
        # Pages deja cachear cada archivo 10 min: sin esto el navegador puede
        # mezclar el index.html nuevo con un contest.js/worker.js viejo. Cada
        # script, el worker, dbcore.js y el .wasm se piden con ?v=<commit>.
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#<script src=\"([a-z]+)\.js\"></script>#<script src=\"\1.js?v=$V\"></script>#; s#new Worker\('worker\.js'\)#new Worker('worker.js?v=$V')#" site/web/index.html
          sed -i -E "s#importScripts\('\.\./build-wasm/dbcore\.js', 'imnet\.js'\)#importScripts('../build-wasm/dbcore.js?v=$V', 'imnet.js?v=$V')#; s#locateFile: \(f\) => '\.\./build-wasm/' \+ f \}#locateFile: (f) => '../build-wasm/' + f + '?v=$V' }#" site/web/worker.js
          test "$(grep -c "\.js?v=$V" site/web/index.html)" -ge 5
          test "$(grep -c "?v=$V" site/web/worker.js)" -ge 2
          cat > site/index.html <<'EOF'
          <!DOCTYPE html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=web/">
          <a href="web/">DarwinBots — port WASM</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
