# Sitio en GitHub Pages (port/web2/PLAN.md E0, decisiones 3 y 5, C1-C4):
#  - raíz:         la interfaz nueva (port/web2, build de Vite con base './').
#  - /classic/:    la clásica (port/web/, congelada, sin cambios en sus fuentes).
#  - /build-wasm/: dbcore.js + dbcore.wasm, compilados una sola vez y
#                  compartidos (classic/worker.js carga ../build-wasm/dbcore.js;
#                  la nueva pide ./build-wasm/dbcore.js?v=<commit>).
# El armado vive en port/web2/scripts/armar-sitio.sh para probarlo igual en local.
# Requiere habilitar Pages en el repo con Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Instalar emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Compilar dbcore.js + dbcore.wasm
        working-directory: port
        run: |
          cmake --preset wasm
          cmake --build --preset wasm --target dbcore_wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: port/web2/package-lock.json
      - name: Compilar la interfaz nueva (Vite)
        working-directory: port/web2
        # DB_BUILD_ID (C4) versiona los pedidos a dbcore.js/dbcore.wasm.
        run: |
          npm ci
          DB_BUILD_ID="${GITHUB_SHA::7}" npx vite build
      - name: Armar el sitio (nueva en la raíz, clásica en classic/, build-wasm/)
        # Incluye el versionado de la clásica (cache busting con ?v=<commit>).
        run: sh port/web2/scripts/armar-sitio.sh site "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
