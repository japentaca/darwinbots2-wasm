<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DarwinBots</title>
    <link rel="icon" href="data:,">
    <script>
    // Tema elegido (src/lib/tema.js): se fija antes de pintar para que no
    // destelle el claro. Sin elección guardada sigue al sistema.
    try {
      const t = localStorage.getItem('darwinbots2.tema');
      if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
    } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
    // Aviso de carga fallida: si a los 8 s la app no se montó (p. ej. un
    // index.html viejo en caché pide assets con hash que ya no existen), se
    // ofrece recargar. src/i18n/index.svelte.js lo muestra enseguida con
    // window.__avisoCarga() si los textos del idioma inicial no bajan y no
    // puede recargar. Corre antes de la app, sin t(): va en los dos idiomas.
    window.__avisoCarga = () => {
      const app = document.getElementById('app');
      if (!app || app.childElementCount > 0) return;
      const p = document.createElement('p');
      p.setAttribute('role', 'alert');
      p.style.cssText = 'font:16px system-ui,sans-serif;margin:32px;';
      p.append('No se pudo cargar la interfaz · The interface could not load — ');
      const a = document.createElement('a');
      a.href = window.location.href;
      a.textContent = 'Recargar / Reload';
      a.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.reload();
      });
      p.append(a);
      app.append(p);
    };
    setTimeout(() => window.__avisoCarga(), 8000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
