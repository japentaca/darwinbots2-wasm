<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DarwinBots — port WASM</title>
<!--
  Capa de presentación web sobre dbcore.wasm (M10 + extensión Rendimiento,
  spec/PROGRESO.md). Regla 4 del brief del port: esta capa NUNCA recalcula
  física ni RNG; solo presenta lo que el core vuelca.

  Extensión Rendimiento: la sim entera (dbcore.wasm + ticks + volcados) corre
  en web/worker.js — un Web Worker — y esta página queda solo con UI y render.
  El worker publica cada frame como UN ArrayBuffer transferible (zero-copy)
  que la página devuelve al terminar de dibujar (ping-pong de búferes, sin
  basura por frame y nunca más de un frame en vuelo). Velocidad "máx" = el
  worker corre a fondo en rebanadas ~12ms sin bloquear jamás esta página.

  Servir desde port/ (el worker carga ../build-wasm/dbcore.js):
      cd port && python -m http.server 8000
      → http://localhost:8000/web/

  Decisiones de capa host visibles aquí (M10 punto 3, fuera del contrato
  de fidelidad):
   - Colores de especie: los elige el usuario en la página (Q01: el
     original los sorteaba con Rnd crudo en la UI). Se pasan al core como
     Long BGR de VB6.
   - Semilla: el input "seed" alimenta db_sim_start, que replica
     `Rnd -1 : Randomize seed/100` de startloaded (main.frm).
   - Teleporters: el botón crea uno LOCAL (entra y sale en esta sim); el
     movimiento de "archivos" .dbo entre sims vive en la API
     (db_sim_tp_outbox_take / db_sim_tp_inbox_push), no en esta página.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0e14; color: #cdd6e4;
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px; background: #131826; border-bottom: 1px solid #232a3d;
  }
  header .group { display: flex; gap: 6px; align-items: center; }
  header .sep { width: 1px; height: 22px; background: #232a3d; }
  button, select, input[type=number] {
    background: #1c2333; color: #dfe6f2; border: 1px solid #2e3a55;
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #253050; }
  button.primary { background: #2b4a8f; border-color: #3a62bd; }
  button.primary:hover { background: #34599f; }
  input[type=number] { width: 90px; cursor: text; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fa3c4; }
  main { flex: 1; display: flex; min-height: 0; }
  #field-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
                background: #06080d; min-width: 0; }
  canvas { background: #0a0f1a; border: 1px solid #1c2333; max-width: 100%; max-height: 100%; }
  aside {
    width: 340px; padding: 10px 12px; background: #101522; overflow-y: auto;
    border-left: 1px solid #232a3d; display: flex; flex-direction: column; gap: 8px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: #7d8fb0; margin: 6px 0 0; }
  textarea {
    width: 100%; height: 180px; background: #0b0f19; color: #b9c8e0;
    border: 1px solid #2e3a55; border-radius: 4px; padding: 6px;
    font: 12px/1.4 ui-monospace, Consolas, monospace; resize: vertical;
  }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row label { color: #93a4c2; }
  input[type=text] { background: #0b0f19; color: #dfe6f2; border: 1px solid #2e3a55;
                     border-radius: 4px; padding: 4px 8px; font: inherit; width: 140px; }
  input[type=color] { width: 36px; height: 26px; padding: 0; border: 1px solid #2e3a55;
                      background: none; border-radius: 4px; cursor: pointer; }
  #log { font: 11px/1.5 ui-monospace, Consolas, monospace; color: #7d8fb0;
         white-space: pre-wrap; max-height: 130px; overflow-y: auto; }
  footer { padding: 4px 12px; font-size: 11px; color: #5c6b88;
           background: #0d1119; border-top: 1px solid #1c2333; }
</style>
</head>
<body>

<header>
  <div class="group">
    <button id="btn-run" class="primary">▶ Iniciar</button>
    <button id="btn-step">Paso</button>
    <button id="btn-reset">Reiniciar</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label for="speed">Velocidad</label>
    <select id="speed">
      <option value="1">1 tick/frame</option>
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="8">8</option>
      <option value="16">16</option>
      <option value="32">32</option>
      <option value="0">máx</option>
    </select>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label for="seed">Seed</label>
    <input type="number" id="seed" value="1234">
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="btn-save">Guardar sim</button>
    <button id="btn-load">Cargar sim</button>
    <input type="file" id="file-load" accept=".dbsim,.sim" style="display:none">
    <button id="btn-teleporter">+ Teleporter local</button>
  </div>
  <div id="stats">cargando dbcore.wasm…</div>
</header>

<main>
  <div id="field-wrap"><canvas id="field" width="900" height="900"></canvas></div>
  <aside>
    <h2>Sembrar especie</h2>
    <div class="row">
      <select id="preset">
        <option value="animal">Animal Minimalis</option>
        <option value="alga">Alga Minimalis (veg)</option>
        <option value="custom">— ADN propio —</option>
      </select>
    </div>
    <textarea id="dna" spellcheck="false"></textarea>
    <div class="row">
      <label>Nombre</label><input type="text" id="sp-name" value="Animal_Minimalis.txt">
      <input type="color" id="sp-color" value="#ff4040" title="Color de la especie (Q01: decide el host)">
    </div>
    <div class="row">
      <label><input type="checkbox" id="sp-veg"> vegetal</label>
      <label>nº</label><input type="number" id="sp-qty" value="5" min="1" style="width:60px">
      <label>nrg</label><input type="number" id="sp-nrg" value="3000" min="1" style="width:80px">
    </div>
    <div class="row"><button id="btn-seed" class="primary">Sembrar</button></div>
    <h2>Registro</h2>
    <div id="log"></div>
  </aside>
</main>

<footer>
  DarwinBots 2.48.32 · core C++→WASM (143 casos dorados en verde) · la sim corre
  en un Web Worker — física y RNG viven en dbcore.wasm; la página solo presenta
</footer>

<script>
'use strict';

// ---- ADN de demostración (contenido de la página, no de la spec) ----------
const PRESETS = {
  animal: {
    name: 'Animal_Minimalis.txt', veg: false, qty: 5, nrg: 3000, color: '#ff4040',
    dna: `' Animal Minimalis
' Gene 1 Food Finder
cond
*.eye5 0 >
*.refeye *.myeye !=
start
*.refveldx .dx store
*.refvelup 30 add .up store
stop

' Gene 2 Eat Food
cond
*.eye5 50 >
*.refeye *.myeye !=
start
-1 .shoot store
*.refvelup .up store
stop

' Gene 3 Avoiding Family
cond
*.eye5 0 =
*.refeye *.myeye = or
start
314 rnd .aimdx store
stop

' Gene 4 Reproduce
cond
*.nrg 20000 >
start
10 .repro store
stop
end
`},
  alga: {
    name: 'Alga_Minimalis.txt', veg: true, qty: 15, nrg: 3000, color: '#30d030',
    dna: `' Alga Minimalis
' Gene 1 Reproduce
cond
*.nrg 5000 >
start
50 .repro store
stop

' Gene 2 turn
cond
*.fixpos 0 =
start
628 rnd 314 sub .aimdx store
stop
end
`}
};

// Color CSS "#rrggbb" → Long BGR de VB6 (RGB() = r + g*256 + b*65536).
function cssToVbColor(css) {
  const r = parseInt(css.slice(1, 3), 16);
  const g = parseInt(css.slice(3, 5), 16);
  const b = parseInt(css.slice(5, 7), 16);
  return r + g * 256 + b * 65536;
}
// Long BGR de VB6 → CSS.
function vbColorToCss(c) {
  c = c | 0;
  const r = c & 0xff, g = (c >> 8) & 0xff, b = (c >> 16) & 0xff;
  return `rgb(${r},${g},${b})`;
}

// ---- Bestiary (bots bajados del foro, web/bots/) --------------------------
// bots.json lo genera el archivador del Bestiary (scripts fuera del repo de
// la sim): un registro por bot validado con el propio dbcore.wasm. La página
// solo los ofrece como presets; si no existe el archivo, todo sigue igual.
let BESTIARY = [];
async function loadBestiary() {
  try {
    const r = await fetch('bots/bots.json');
    if (!r.ok) return;
    BESTIARY = await r.json();
    const sel = document.getElementById('preset');
    const groups = new Map();
    BESTIARY.forEach((b, i) => {
      let g = groups.get(b.board);
      if (!g) {
        g = document.createElement('optgroup');
        g.label = 'Bestiary · ' + b.board;
        groups.set(b.board, g);
        sel.appendChild(g);
      }
      const o = document.createElement('option');
      o.value = 'bestiary:' + i;
      o.textContent = b.name + (b.veg ? ' (veg)' : '');
      g.appendChild(o);
    });
    if (BESTIARY.length) log(`bestiary: ${BESTIARY.length} bots del foro en el selector`);
  } catch (e) { /* sin bots.json (p. ej. file://): la página sigue igual */ }
}

// ---- Worker de sim --------------------------------------------------------
// La sim corre entera en worker.js (protocolo documentado allí); esta página
// solo manda comandos y dibuja el último frame recibido.
const worker = new Worker('worker.js');

const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const statsEl = document.getElementById('stats');

function log(msg) {
  logEl.textContent = msg + '\n' + logEl.textContent;
}

let latest = null;       // último frame recibido, pendiente de dibujar
let rafPending = false;
let stats = { cycle: 0, bots: 0, vegs: 0, tps: 0 };
let frames = 0, lastFpsT = performance.now(), fps = 0;
let drawMs = 0;          // media móvil del costo de draw() (¿hace falta WebGL?)

worker.onerror = (e) =>
  log(`Error en worker: ${e.message} (${e.filename}:${e.lineno})`);

worker.onmessage = (e) => {
  const msg = e.data;
  switch (msg.t) {
    case 'ready':
      onReady();
      break;
    case 'frame':
      latest = msg;
      if (!rafPending) { rafPending = true; requestAnimationFrame(renderFrame); }
      break;
    case 'log':
      log(msg.msg);
      updateStats();
      break;
    case 'saved': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([msg.bytes]));
      a.download = `darwinbots-ciclo${msg.cycle}.dbsim`;
      a.click();
      URL.revokeObjectURL(a.href);
      log(`sim guardada (${msg.bytes.byteLength} bytes, formato binario de VB6)`);
      break;
    }
    case 'error':
      statsEl.textContent = 'error cargando dbcore.wasm';
      log('Error: ' + msg.msg + '\n¿Está compilado el preset wasm? ' +
          '(cmake --preset wasm && cmake --build --preset wasm)');
      break;
  }
};

function renderFrame() {
  rafPending = false;
  if (!latest) return;
  const { buf, stats: st } = latest;
  latest = null;
  stats = st;
  const t0 = performance.now();
  draw(new Float32Array(buf));
  drawMs = drawMs * 0.9 + (performance.now() - t0) * 0.1;
  worker.postMessage({ t: 'ack', buf }, [buf]);  // ping-pong: devolver el búfer
  frames++;
  const now = performance.now();
  if (now - lastFpsT >= 1000) {
    fps = frames; frames = 0; lastFpsT = now;
  }
  updateStats();
}

function updateStats() {
  statsEl.textContent =
    `ciclo ${stats.cycle} · bots ${stats.bots} · vegs ${stats.vegs}` +
    ` · ${stats.tps} ticks/s · ${fps} fps · draw ${drawMs.toFixed(1)} ms`;
}

// ---- Render (layout del frame: ver cabecera de worker.js) -----------------
function draw(v) {
  const W = v[0], Hh = v[1];
  const nB = v[2], nS = v[3], nT = v[4], nO = v[5], nP = v[6];
  const oBots = 8;
  const oShots = oBots + nB * 8;
  const oTies = oShots + nS * 6;
  const oObs = oTies + nT * 5;
  const oTps = oObs + nO * 5;
  const s = Math.min(canvas.width / W, canvas.height / Hh);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // obstáculos
  for (let i = 0; i < nO; i++) {
    const o = oObs + i * 5;
    ctx.fillStyle = vbColorToCss(v[o + 4]);
    ctx.globalAlpha = 0.6;
    ctx.fillRect(v[o] * s, v[o + 1] * s, v[o + 2] * s, v[o + 3] * s);
    ctx.globalAlpha = 1;
  }

  // teleporters
  for (let i = 0; i < nP; i++) {
    const o = oTps + i * 7;
    ctx.strokeStyle = vbColorToCss(v[o + 4]);
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(v[o] * s, v[o + 1] * s, v[o + 2] * s, v[o + 3] * s);
    ctx.setLineDash([]);
  }

  // ties (debajo de los bots)
  for (let i = 0; i < nT; i++) {
    const o = oTies + i * 5;
    ctx.strokeStyle = v[o + 4] === 3 ? '#c8b060' : '#4a5a78';
    ctx.lineWidth = v[o + 4] === 3 ? 1.5 : 1;
    ctx.beginPath();
    ctx.moveTo(v[o] * s, v[o + 1] * s);
    ctx.lineTo(v[o + 2] * s, v[o + 3] * s);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // shots
  for (let i = 0; i < nS; i++) {
    const o = oShots + i * 6;
    ctx.strokeStyle = vbColorToCss(v[o + 4]);
    ctx.beginPath();
    ctx.moveTo(v[o] * s, v[o + 1] * s);
    ctx.lineTo((v[o] - v[o + 2] * 0.6) * s, (v[o + 1] - v[o + 3] * 0.6) * s);
    ctx.stroke();
  }

  // bots
  for (let i = 0; i < nB; i++) {
    const o = oBots + i * 8;
    const x = v[o + 1] * s, y = v[o + 2] * s, r = Math.max(v[o + 3] * s, 1.2);
    const flags = v[o + 7];
    const corpse = flags & 4;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = corpse ? '#555' : vbColorToCss(v[o + 6]);
    ctx.fill();
    ctx.strokeStyle = corpse ? '#777' : 'rgba(255,255,255,0.55)';
    ctx.stroke();
    // marcador de rumbo: y de mundo crece hacia abajo, aim antihorario
    const aim = v[o + 4];
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(aim) * r, y - Math.sin(aim) * r);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.stroke();
  }
}

// ---- Montaje de la sim ----------------------------------------------------
function newSim() {
  const seed = parseFloat(document.getElementById('seed').value) || 0;
  const alga = PRESETS.alga;
  worker.postMessage({
    t: 'reset', seed,
    // Opciones de la demo (capa host): campo 32000², economía vegetal viva.
    options: { fieldW: 32000, fieldH: 32000, minVegs: 15,
               repopAmount: 10, repopCooldown: 10,
               maxEnergy: 10,       // reparto de nrg por ciclo (feedvegs)
               startChlr: 16000,    // default de la UI original (.gset)
               mutations: true },
    // Alga de arranque para que la repoblación tenga especie elegible.
    species: [{ dna: alga.dna, name: alga.name, veg: true, qty: alga.qty,
                nrg: alga.nrg, color: cssToVbColor(alga.color) }],
  });
}

function seedFromForm() {
  worker.postMessage({
    t: 'seed-species',
    sp: {
      dna: document.getElementById('dna').value,
      name: document.getElementById('sp-name').value || 'bot.txt',
      veg: document.getElementById('sp-veg').checked,
      qty: parseInt(document.getElementById('sp-qty').value, 10) || 1,
      nrg: parseFloat(document.getElementById('sp-nrg').value) || 3000,
      color: cssToVbColor(document.getElementById('sp-color').value),
    },
  });
}

// ---- Controles ------------------------------------------------------------
let running = false;
const btnRun = document.getElementById('btn-run');

function setRunning(r) {
  running = r;
  btnRun.textContent = running ? '⏸ Pausar' : '▶ Iniciar';
  worker.postMessage({ t: 'run', running });
}

btnRun.onclick = () => setRunning(!running);
document.getElementById('btn-step').onclick = () =>
  worker.postMessage({ t: 'step' });
document.getElementById('btn-reset').onclick = () => {
  setRunning(false);
  newSim();
};
document.getElementById('btn-seed').onclick = seedFromForm;

document.getElementById('speed').onchange = (e) =>
  worker.postMessage({ t: 'speed', n: parseInt(e.target.value, 10) });

document.getElementById('preset').onchange = async (e) => {
  const v = e.target.value;
  if (v.startsWith('bestiary:')) {
    const b = BESTIARY[parseInt(v.slice(9), 10)];
    const r = await fetch('bots/' + b.file);
    if (!r.ok) { log(`no pude leer bots/${b.file}`); return; }
    document.getElementById('dna').value = await r.text();
    document.getElementById('sp-name').value = b.name + '.txt';
    document.getElementById('sp-veg').checked = b.veg;
    document.getElementById('sp-qty').value = b.veg ? 15 : 5;
    document.getElementById('sp-nrg').value = 3000;
    return;
  }
  const p = PRESETS[v];
  if (!p) return;
  document.getElementById('dna').value = p.dna;
  document.getElementById('sp-name').value = p.name;
  document.getElementById('sp-veg').checked = p.veg;
  document.getElementById('sp-qty').value = p.qty;
  document.getElementById('sp-nrg').value = p.nrg;
  document.getElementById('sp-color').value = p.color;
};

document.getElementById('btn-save').onclick = () =>
  worker.postMessage({ t: 'save' });

document.getElementById('btn-load').onclick = () =>
  document.getElementById('file-load').click();
document.getElementById('file-load').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const bytes = await f.arrayBuffer();
  setRunning(false);
  worker.postMessage({ t: 'load', bytes, name: f.name }, [bytes]);
  log(`cargando ${f.name}…`);
  e.target.value = '';
};

document.getElementById('btn-teleporter').onclick = () =>
  worker.postMessage({ t: 'teleporter' });

// ---- Arranque -------------------------------------------------------------
function onReady() {
  const p = PRESETS.animal;
  document.getElementById('dna').value = p.dna;
  worker.postMessage({ t: 'speed', n: parseInt(document.getElementById('speed').value, 10) });
  newSim();
  loadBestiary();
  log('dbcore.wasm cargado (en worker)');
  updateStats();
}
</script>
</body>
</html>
