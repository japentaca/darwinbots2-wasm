<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DarwinBots — port WASM (M10)</title>
<!--
  M10 — Capa de presentación web sobre dbcore.wasm (spec/PROGRESO.md).
  Regla 4 del brief del port: esta capa NUNCA recalcula física ni RNG;
  solo llama a db_sim_* y dibuja lo que el core vuelca.

  Servir desde port/ (el script carga ../build-wasm/dbcore.js):
      cd port && python -m http.server 8000
      → http://localhost:8000/web/

  Decisiones de capa host visibles aquí (M10 punto 3, fuera del contrato
  de fidelidad):
   - Colores de especie: los elige el usuario en la página (Q01: el
     original los sorteaba con Rnd crudo en la UI). Se pasan al core como
     Long BGR de VB6.
   - Semilla: el input "seed" alimenta db_sim_start, que replica
     `Rnd -1 : Randomize seed/100` de startloaded (main.frm).
   - Teleporters: el botón crea uno LOCAL (entra y sale en esta sim); el
     movimiento de "archivos" .dbo entre sims vive en la API
     (db_sim_tp_outbox_take / db_sim_tp_inbox_push), no en esta página.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0e14; color: #cdd6e4;
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px; background: #131826; border-bottom: 1px solid #232a3d;
  }
  header .group { display: flex; gap: 6px; align-items: center; }
  header .sep { width: 1px; height: 22px; background: #232a3d; }
  button, select, input[type=number] {
    background: #1c2333; color: #dfe6f2; border: 1px solid #2e3a55;
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #253050; }
  button.primary { background: #2b4a8f; border-color: #3a62bd; }
  button.primary:hover { background: #34599f; }
  input[type=number] { width: 90px; cursor: text; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fa3c4; }
  main { flex: 1; display: flex; min-height: 0; }
  #field-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
                background: #06080d; min-width: 0; }
  canvas { background: #0a0f1a; border: 1px solid #1c2333; max-width: 100%; max-height: 100%; }
  aside {
    width: 340px; padding: 10px 12px; background: #101522; overflow-y: auto;
    border-left: 1px solid #232a3d; display: flex; flex-direction: column; gap: 8px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: #7d8fb0; margin: 6px 0 0; }
  textarea {
    width: 100%; height: 180px; background: #0b0f19; color: #b9c8e0;
    border: 1px solid #2e3a55; border-radius: 4px; padding: 6px;
    font: 12px/1.4 ui-monospace, Consolas, monospace; resize: vertical;
  }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row label { color: #93a4c2; }
  input[type=text] { background: #0b0f19; color: #dfe6f2; border: 1px solid #2e3a55;
                     border-radius: 4px; padding: 4px 8px; font: inherit; width: 140px; }
  input[type=color] { width: 36px; height: 26px; padding: 0; border: 1px solid #2e3a55;
                      background: none; border-radius: 4px; cursor: pointer; }
  #log { font: 11px/1.5 ui-monospace, Consolas, monospace; color: #7d8fb0;
         white-space: pre-wrap; max-height: 130px; overflow-y: auto; }
  footer { padding: 4px 12px; font-size: 11px; color: #5c6b88;
           background: #0d1119; border-top: 1px solid #1c2333; }
</style>
</head>
<body>

<header>
  <div class="group">
    <button id="btn-run" class="primary">▶ Iniciar</button>
    <button id="btn-step">Paso</button>
    <button id="btn-reset">Reiniciar</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label for="speed">Velocidad</label>
    <select id="speed">
      <option value="1">1 tick/frame</option>
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="8">8</option>
      <option value="16">16</option>
      <option value="32">32</option>
    </select>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label for="seed">Seed</label>
    <input type="number" id="seed" value="1234">
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="btn-save">Guardar sim</button>
    <button id="btn-load">Cargar sim</button>
    <input type="file" id="file-load" accept=".dbsim,.sim" style="display:none">
    <button id="btn-teleporter">+ Teleporter local</button>
  </div>
  <div id="stats">cargando dbcore.wasm…</div>
</header>

<main>
  <div id="field-wrap"><canvas id="field" width="900" height="900"></canvas></div>
  <aside>
    <h2>Sembrar especie</h2>
    <div class="row">
      <select id="preset">
        <option value="animal">Animal Minimalis</option>
        <option value="alga">Alga Minimalis (veg)</option>
        <option value="custom">— ADN propio —</option>
      </select>
    </div>
    <textarea id="dna" spellcheck="false"></textarea>
    <div class="row">
      <label>Nombre</label><input type="text" id="sp-name" value="Animal_Minimalis.txt">
      <input type="color" id="sp-color" value="#ff4040" title="Color de la especie (Q01: decide el host)">
    </div>
    <div class="row">
      <label><input type="checkbox" id="sp-veg"> vegetal</label>
      <label>nº</label><input type="number" id="sp-qty" value="5" min="1" style="width:60px">
      <label>nrg</label><input type="number" id="sp-nrg" value="3000" min="1" style="width:80px">
    </div>
    <div class="row"><button id="btn-seed" class="primary">Sembrar</button></div>
    <h2>Registro</h2>
    <div id="log"></div>
  </aside>
</main>

<footer>
  DarwinBots 2.48.32 · core C++→WASM (143 casos dorados en verde) · la página solo
  presenta el estado que vuelca el core — física y RNG viven en dbcore.wasm
</footer>

<script src="../build-wasm/dbcore.js"></script>
<script>
'use strict';

// ---- ADN de demostración (contenido de la página, no de la spec) ----------
const PRESETS = {
  animal: {
    name: 'Animal_Minimalis.txt', veg: false, qty: 5, nrg: 3000, color: '#ff4040',
    dna: `' Animal Minimalis
' Gene 1 Food Finder
cond
*.eye5 0 >
*.refeye *.myeye !=
start
*.refveldx .dx store
*.refvelup 30 add .up store
stop

' Gene 2 Eat Food
cond
*.eye5 50 >
*.refeye *.myeye !=
start
-1 .shoot store
*.refvelup .up store
stop

' Gene 3 Avoiding Family
cond
*.eye5 0 =
*.refeye *.myeye = or
start
314 rnd .aimdx store
stop

' Gene 4 Reproduce
cond
*.nrg 20000 >
start
10 .repro store
stop
end
`},
  alga: {
    name: 'Alga_Minimalis.txt', veg: true, qty: 15, nrg: 3000, color: '#30d030',
    dna: `' Alga Minimalis
' Gene 1 Reproduce
cond
*.nrg 5000 >
start
50 .repro store
stop

' Gene 2 turn
cond
*.fixpos 0 =
start
628 rnd 314 sub .aimdx store
stop
end
`}
};

// ---- Puentes C ------------------------------------------------------------
let M = null;   // Module de Emscripten
let api = {};   // cwraps
let sim = 0;    // handle

const C = (name, ret, args) => M.cwrap(name, ret, args);

function bindApi() {
  api = {
    create:        C('db_sim_create', 'number', []),
    destroy:       C('db_sim_destroy', null, ['number']),
    start:         C('db_sim_start', null, ['number', 'number']),
    tick:          C('db_sim_tick', null, ['number']),
    setField:      C('db_sim_set_field', null, ['number', 'number', 'number']),
    fieldW:        C('db_sim_field_width', 'number', ['number']),
    fieldH:        C('db_sim_field_height', 'number', ['number']),
    setMinVegs:    C('db_sim_set_minvegs', null, ['number', 'number']),
    setRepop:      C('db_sim_set_repop', null, ['number', 'number', 'number']),
    setMaxEnergy:  C('db_sim_set_max_energy', null, ['number', 'number']),
    setMutations:  C('db_sim_set_mutations', null, ['number', 'number']),
    setStartChlr:  C('db_sim_set_start_chlr', null, ['number', 'number']),
    addSpecies:    C('db_sim_add_species', 'number',
                     ['number', 'string', 'string', 'number', 'number', 'number', 'number', 'number']),
    seedSpecies:   C('db_sim_seed_species', 'number', ['number', 'number', 'number']),
    cycle:         C('db_sim_cycle', 'number', ['number']),
    totalRobots:   C('db_sim_total_robots', 'number', ['number']),
    maxRobs:       C('db_sim_max_robs', 'number', ['number']),
    totvegs:       C('db_sim_totvegs', 'number', ['number']),
    shotsCap:      C('db_sim_shots_capacity', 'number', ['number']),
    numObstacles:  C('db_sim_num_obstacles', 'number', ['number']),
    numTeleporters:C('db_sim_num_teleporters', 'number', ['number']),
    dumpBots:      C('db_sim_dump_bots', 'number', ['number', 'number', 'number']),
    dumpShots:     C('db_sim_dump_shots', 'number', ['number', 'number', 'number']),
    dumpTies:      C('db_sim_dump_ties', 'number', ['number', 'number', 'number']),
    dumpObstacles: C('db_sim_dump_obstacles', 'number', ['number', 'number', 'number']),
    dumpTeleporters:C('db_sim_dump_teleporters', 'number', ['number', 'number', 'number']),
    addTeleporter: C('db_sim_add_teleporter', 'number',
                     ['number','number','number','number','number','number','number','number','number','number']),
    save:          C('db_sim_save', 'number', ['number', 'number']),
    load:          C('db_sim_load', null, ['number', 'number', 'number']),
    free:          C('db_free', null, ['number']),
  };
}

// Color CSS "#rrggbb" → Long BGR de VB6 (RGB() = r + g*256 + b*65536).
function cssToVbColor(css) {
  const r = parseInt(css.slice(1, 3), 16);
  const g = parseInt(css.slice(3, 5), 16);
  const b = parseInt(css.slice(5, 7), 16);
  return r + g * 256 + b * 65536;
}
// Long BGR de VB6 → CSS.
function vbColorToCss(c) {
  c = c | 0;
  const r = c & 0xff, g = (c >> 8) & 0xff, b = (c >> 16) & 0xff;
  return `rgb(${r},${g},${b})`;
}

// ---- Búferes de volcado (crecen bajo demanda) -----------------------------
const buf = { bots: {p:0, cap:0}, shots: {p:0, cap:0}, ties: {p:0, cap:0},
              obs: {p:0, cap:0}, tps: {p:0, cap:0} };

function ensure(b, floatsNeeded) {
  if (b.cap >= floatsNeeded) return;
  if (b.p) M._free(b.p);
  b.cap = Math.ceil(floatsNeeded * 1.5) + 64;
  b.p = M._malloc(b.cap * 4);
}
function view(b, floats) {
  return new Float32Array(M.HEAPF32.buffer, b.p, floats);
}

// ---- Render ---------------------------------------------------------------
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const statsEl = document.getElementById('stats');

function log(msg) {
  logEl.textContent = msg + '\n' + logEl.textContent;
}

function draw() {
  const W = api.fieldW(sim), Hh = api.fieldH(sim);
  const s = Math.min(canvas.width / W, canvas.height / Hh);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // obstáculos
  {
    const n = api.numObstacles(sim);
    if (n > 0) {
      ensure(buf.obs, n * 5);
      const w = api.dumpObstacles(sim, buf.obs.p, n);
      const v = view(buf.obs, w * 5);
      for (let i = 0; i < w; i++) {
        const o = i * 5;
        ctx.fillStyle = vbColorToCss(v[o + 4]);
        ctx.globalAlpha = 0.6;
        ctx.fillRect(v[o] * s, v[o + 1] * s, v[o + 2] * s, v[o + 3] * s);
        ctx.globalAlpha = 1;
      }
    }
  }

  // teleporters
  {
    const n = api.numTeleporters(sim);
    if (n > 0) {
      ensure(buf.tps, n * 7);
      const w = api.dumpTeleporters(sim, buf.tps.p, n);
      const v = view(buf.tps, w * 7);
      for (let i = 0; i < w; i++) {
        const o = i * 7;
        ctx.strokeStyle = vbColorToCss(v[o + 4]);
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(v[o] * s, v[o + 1] * s, v[o + 2] * s, v[o + 3] * s);
        ctx.setLineDash([]);
      }
    }
  }

  // ties (debajo de los bots)
  {
    const cap = api.maxRobs(sim) * 9;
    if (cap > 0) {
      ensure(buf.ties, cap * 5);
      const w = api.dumpTies(sim, buf.ties.p, cap);
      const v = view(buf.ties, w * 5);
      for (let i = 0; i < w; i++) {
        const o = i * 5;
        ctx.strokeStyle = v[o + 4] === 3 ? '#c8b060' : '#4a5a78';
        ctx.lineWidth = v[o + 4] === 3 ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(v[o] * s, v[o + 1] * s);
        ctx.lineTo(v[o + 2] * s, v[o + 3] * s);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    }
  }

  // shots
  {
    const cap = api.shotsCap(sim);
    ensure(buf.shots, cap * 6);
    const w = api.dumpShots(sim, buf.shots.p, cap);
    const v = view(buf.shots, w * 6);
    for (let i = 0; i < w; i++) {
      const o = i * 6;
      ctx.strokeStyle = vbColorToCss(v[o + 4]);
      ctx.beginPath();
      ctx.moveTo(v[o] * s, v[o + 1] * s);
      ctx.lineTo((v[o] - v[o + 2] * 0.6) * s, (v[o + 1] - v[o + 3] * 0.6) * s);
      ctx.stroke();
    }
  }

  // bots
  {
    const cap = api.maxRobs(sim);
    if (cap > 0) {
      ensure(buf.bots, cap * 8);
      const w = api.dumpBots(sim, buf.bots.p, cap);
      const v = view(buf.bots, w * 8);
      for (let i = 0; i < w; i++) {
        const o = i * 8;
        const x = v[o + 1] * s, y = v[o + 2] * s, r = Math.max(v[o + 3] * s, 1.2);
        const flags = v[o + 7];
        const corpse = flags & 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = corpse ? '#555' : vbColorToCss(v[o + 6]);
        ctx.fill();
        ctx.strokeStyle = corpse ? '#777' : 'rgba(255,255,255,0.55)';
        ctx.stroke();
        // marcador de rumbo: y de mundo crece hacia abajo, aim antihorario
        const aim = v[o + 4];
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(aim) * r, y - Math.sin(aim) * r);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.stroke();
      }
    }
  }
}

// ---- Loop -----------------------------------------------------------------
let running = false;
let frames = 0, lastFpsT = performance.now(), fps = 0;

function updateStats() {
  statsEl.textContent =
    `ciclo ${api.cycle(sim)} · bots ${api.totalRobots(sim)}` +
    ` · vegs ${Math.max(api.totvegs(sim), 0)} · ${fps} fps`;
}

function frame() {
  if (running) {
    const n = parseInt(document.getElementById('speed').value, 10);
    for (let i = 0; i < n; i++) api.tick(sim);
  }
  draw();
  updateStats();
  frames++;
  const now = performance.now();
  if (now - lastFpsT >= 1000) {
    fps = frames; frames = 0; lastFpsT = now;
  }
  requestAnimationFrame(frame);
}

// ---- Montaje de la sim ----------------------------------------------------
function newSim() {
  if (sim) api.destroy(sim);
  sim = api.create();
  // Opciones de la demo (capa host): campo 32000², economía vegetal viva.
  api.setField(sim, 32000, 32000);
  api.setMinVegs(sim, 15);
  api.setRepop(sim, 10, 10);
  api.setMaxEnergy(sim, 10);       // reparto de nrg por ciclo (feedvegs)
  api.setStartChlr(sim, 16000);    // default de la UI original (.gset)
  api.setMutations(sim, 1);
  const seed = parseFloat(document.getElementById('seed').value) || 0;
  api.start(sim, seed);            // Rnd -1 + Randomize seed/100 + buckets
  // Alga de arranque para que la repoblación tenga especie elegible.
  const alga = PRESETS.alga;
  const idx = api.addSpecies(sim, alga.dna, alga.name, 1, 0, alga.nrg,
                             cssToVbColor(alga.color), alga.qty);
  const n = api.seedSpecies(sim, idx, 0);
  log(`sim nueva (seed ${seed}): ${n} × ${alga.name}`);
}

function seedFromForm() {
  const dna = document.getElementById('dna').value;
  const name = document.getElementById('sp-name').value || 'bot.txt';
  const veg = document.getElementById('sp-veg').checked ? 1 : 0;
  const qty = parseInt(document.getElementById('sp-qty').value, 10) || 1;
  const nrg = parseFloat(document.getElementById('sp-nrg').value) || 3000;
  const color = cssToVbColor(document.getElementById('sp-color').value);
  const idx = api.addSpecies(sim, dna, name, veg, 0, nrg, color, qty);
  const n = api.seedSpecies(sim, idx, 0);
  log(n > 0 ? `sembrados ${n} × ${name}`
            : `ADN rechazado por el cargador (${name})`);
}

// ---- Controles ------------------------------------------------------------
const btnRun = document.getElementById('btn-run');
btnRun.onclick = () => {
  running = !running;
  btnRun.textContent = running ? '⏸ Pausar' : '▶ Iniciar';
};
document.getElementById('btn-step').onclick = () => { api.tick(sim); };
document.getElementById('btn-reset').onclick = () => {
  running = false; btnRun.textContent = '▶ Iniciar'; newSim();
};
document.getElementById('btn-seed').onclick = seedFromForm;

document.getElementById('preset').onchange = (e) => {
  const p = PRESETS[e.target.value];
  if (!p) return;
  document.getElementById('dna').value = p.dna;
  document.getElementById('sp-name').value = p.name;
  document.getElementById('sp-veg').checked = p.veg;
  document.getElementById('sp-qty').value = p.qty;
  document.getElementById('sp-nrg').value = p.nrg;
  document.getElementById('sp-color').value = p.color;
};

document.getElementById('btn-save').onclick = () => {
  const lenP = M._malloc(4);
  const p = api.save(sim, lenP);
  const len = M.HEAP32[lenP >> 2];
  M._free(lenP);
  if (!p || len <= 0) { log('guardado vacío'); return; }
  const bytes = new Uint8Array(M.HEAPU8.buffer, p, len).slice();
  api.free(p);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes]));
  a.download = `darwinbots-ciclo${api.cycle(sim)}.dbsim`;
  a.click();
  URL.revokeObjectURL(a.href);
  log(`sim guardada (${len} bytes, formato binario de VB6)`);
};

document.getElementById('btn-load').onclick = () =>
  document.getElementById('file-load').click();
document.getElementById('file-load').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  const p = M._malloc(bytes.length);
  M.HEAPU8.set(bytes, p);
  api.load(sim, p, bytes.length);
  M._free(p);
  running = false; btnRun.textContent = '▶ Iniciar';
  log(`sim cargada: ${f.name} (${bytes.length} bytes), ` +
      `ciclo ${api.cycle(sim)}, ${api.totalRobots(sim)} bots`);
  e.target.value = '';
};

document.getElementById('btn-teleporter').onclick = () => {
  // local: entra y sale en esta sim (2 RNG + ReSpawn); alto 3000 twips
  const i = api.addTeleporter(sim, 0, 0, 3000, 0, 1, 0, 0, 1, 100);
  log(i > 0 ? `teleporter local #${i} creado`
            : 'tope de teleporters (10) alcanzado');
};

// ---- Arranque -------------------------------------------------------------
createDbCore().then((Module) => {
  M = Module;
  bindApi();
  const p = PRESETS.animal;
  document.getElementById('dna').value = p.dna;
  newSim();
  updateStats();
  requestAnimationFrame(frame);
  log('dbcore.wasm cargado');
}).catch((err) => {
  statsEl.textContent = 'error cargando dbcore.wasm';
  log('Error: ' + err + '\n¿Está compilado el preset wasm? ' +
      '(cmake --preset wasm && cmake --build --preset wasm)');
});
</script>
</body>
</html>
