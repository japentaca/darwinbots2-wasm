# Plain-English entries: movement, position and body senses
registros:
  - {addr: 1, escribe: "Your DNA.", lee: "The engine, in the forces and collisions phase of the same cycle. It does not push an anchored bot, or a species with DNA-controlled movement turned off.", borra: "The engine, always, in the movement phase of the same cycle.", rango: "−32000 to 32000; the push from mass is clipped to [[.maxvel]]."}
  - {addr: 2, escribe: "Your DNA.", lee: "The engine, in the forces and collisions phase of the same cycle, subtracting it from [[.up]].", borra: "The engine, always, in the movement phase of the same cycle.", rango: "−32000 to 32000; a negative value pushes forward."}
  - {addr: 3, escribe: "Your DNA.", lee: "The engine, in the forces and collisions phase of the same cycle, subtracting [[.dx]] from it.", borra: "The engine, always, in the movement phase of the same cycle.", rango: "−32000 to 32000; a negative value pushes to the right."}
  - {addr: 4, escribe: "Your DNA.", lee: "The engine, in the forces and collisions phase of the same cycle, subtracting it from [[.sx]].", borra: "The engine, always, in the movement phase of the same cycle.", rango: "−32000 to 32000; a negative value pushes to the left."}
  - {addr: 5, escribe: "Your DNA.", lee: "The engine, in the movement phase of the same cycle. It is ignored if you wrote to [[.setaim]] a heading different from the current one.", borra: "The engine, in the movement phase of the same cycle, after turning.", rango: "−32000 to 32000; 1256 is one full turn and a negative value turns left."}
  - {addr: 6, escribe: "Your DNA.", lee: "The engine, in the movement phase of the same cycle. It is ignored if you wrote to [[.setaim]] a heading different from the current one.", borra: "The engine, in the movement phase of the same cycle, after turning.", rango: "−32000 to 32000; 1256 is one full turn and a negative value turns right."}
  - {addr: 11, escribe: "The engine, in the movement phase of every cycle: the speed cap from the settings. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle. Writing to it changes nothing.", rango: "That of [[param:opt:11]]; 40 by default. It is 0 in the first cycle of life."}
  - {addr: 18, escribe: "The engine, in the movement phase, after turning the bot. You read it in the next cycle; the other bots see it in [[.refaim]].", borra: "Nobody; the engine rewrites it every cycle. Writing to it does not turn the bot.", rango: "0 to 1255 (1256 is one full turn); it can overshoot a little if something else turns the bot. It is 0 in the first cycle of life."}
  - {addr: 19, escribe: "Your DNA. The engine seeds it at birth with the bot's heading. In Player Bot mode, the heading toward the mouse overrides what your DNA wrote.", borra: "The engine, in the movement phase, after turning: it does not set it to 0, it copies the current heading into it.", rango: "−32000 to 32000; the remainder of dividing by 1256 is taken. It turns the bot only if it differs from the current heading."}
  - {addr: 196, escribe: "The engine, in the movement phase, after moving the bot: the rounded speed. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 to [[.maxvel]] (never more than 200). It is 0 in the first cycle of life."}
  - {addr: 197, escribe: "The engine, in the movement phase, after moving and turning the bot: [[.veldx]] with its sign flipped. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "Between minus and plus [[.maxvel]]; positive to the left."}
  - {addr: 198, escribe: "The engine, in the movement phase, after moving and turning the bot: the sideways velocity relative to the new heading. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "Between minus and plus [[.maxvel]]; positive to the right."}
  - {addr: 199, escribe: "The engine, in the movement phase, after moving and turning the bot: [[.velup]] with its sign flipped. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "Between minus and plus [[.maxvel]]; positive when reversing."}
  - {addr: 200, escribe: "The engine, in the movement phase, after moving and turning the bot: the forward velocity relative to the new heading. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "Between minus and plus [[.maxvel]]; positive forward."}
  - {addr: 215, escribe: "The engine, in the actions phase of every cycle: 1 if the bot ended up anchored, 0 if not. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle. Writing to it neither anchors nor releases.", rango: "0 or 1."}
  - {addr: 216, escribe: "Your DNA. If the species was loaded marked as anchored, the bot is born with 1.", lee: "The engine, in the forces and collisions phase of every cycle, unless the simulation has anchoring turned off.", borra: "Never: what you wrote stays until you change it.", rango: "−32000 to 32000; more than 0 anchors the bot, 0 or less releases it."}
  - {addr: 214, escribe: "The engine, in the forces and collisions phase: 1 if the bot touches a wall of the world. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 217, escribe: "The engine, in the actions phase of every cycle: the height of the bot's center from the top edge. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 to 31999; past 32000 it starts over from 0. The settings can divide it by a factor."}
  - {addr: 218, escribe: "The engine, at the end of the cycle, in the sun phase: 1 if there was sun (and, with chloroplasts, if the bot is in the lit strip); otherwise 0. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 or 1."}
  - {addr: 219, escribe: "The engine, in the actions phase of every cycle: the distance from the bot's center to the left edge. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 to 31999; past 32000 it starts over from 0. The settings can divide it by a factor."}
  - {addr: 400, escribe: "The engine, in the actions phase of every cycle: 1 if the bot is aiming up (heading between 278 and 350), 0 if not. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 or 1."}
  - {addr: 401, escribe: "The engine, in the actions phase of every cycle: all the bots in the world, corpses and the bot itself included. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 to 32000."}
  - {addr: 402, escribe: "The engine, in the actions phase of every cycle: the living bots of your species, the bot itself included. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "0 to 32000."}
  - {addr: 201, escribe: "The engine, in the forces and collisions phase: 1 if the bot overlaps another bot or an obstacle. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 205, escribe: "The engine, in the forces and collisions phase: 1 if what it touches is in front, within about 45 degrees of its heading. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 206, escribe: "The engine, in the forces and collisions phase: 1 if what it touches is behind, within about 45 degrees of the direction opposite to its heading. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 207, escribe: "The engine, in the forces and collisions phase: 1 if what it touches is on its right, within the quarter turn centered on that side. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 208, escribe: "The engine, in the forces and collisions phase: 1 if what it touches is on its left, within the quarter turn centered on that side. You read it in the next cycle.", borra: "The engine, when the senses are cleared, right after your DNA.", rango: "0 or 1."}
  - {addr: 221, escribe: "Nobody: the engine never writes it. It works as free memory.", borra: "Nobody: it keeps whatever you store until you change it.", rango: "−32000 to 32000; it is 0 at birth."}
  - {addr: 194, escribe: "The engine, in the actions phase of every cycle: the body now minus the body one cycle ago. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "−32000 to 32000; negative if the bot lost body."}
  - {addr: 195, escribe: "The engine, in the actions phase of every cycle: the body one cycle ago minus the body now. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "−32000 to 32000; negative if the bot gained body."}
  - {addr: 203, escribe: "The engine, in the actions phase of every cycle: the energy one cycle ago minus the energy now. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "−32000 to 32000; negative if the bot gained energy."}
  - {addr: 204, escribe: "The engine, in the actions phase of every cycle: the energy now minus the energy one cycle ago. You read it in the next cycle.", borra: "Nobody; the engine rewrites it every cycle.", rango: "−32000 to 32000; negative if the bot lost energy."}
