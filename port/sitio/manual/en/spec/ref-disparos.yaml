# Plain-English entries: what it sees (ref*) and shots (shoot, shootval, shot flavors, backshot, aimshoot)
registros:
  - {addr: 7, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: if it is not 0 and you have energy left, it shoots.", borra: "The engine, always, in the actions phase, whether or not the shot went out.", rango: "−32000 to 32000. −1, −2, −3, −4, −6, −8 and the positive values shoot; the positive ones are memory shots, modulo 1000 (an exact multiple of 1000 gives sperm). Any other negative value does nothing."}
  - {addr: 8, escribe: "Your DNA.", lee: "The engine, in the actions phase, if [[.shoot]] is not 0: it adjusts that shot.", borra: "The engine, in the actions phase, whenever [[.shoot]] is not 0, even if the shot doesn't go out. If you don't shoot, it stays set.", rango: "−32000 to 32000."}
  - {addr: 202, escribe: "The engine, in the shots phase, when one hits you: its type. If several hit you, the last one stays. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−8 to −1 depending on the type, or 1 to 1000 if it was a memory shot; 0 if nothing hit you."}
  - {addr: 209, escribe: "The engine, in the shots phase, when one hits you: the angle it came from, measured from your front toward the right. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 1256 (one full turn): 314 is the right, 628 behind, 942 the left; straight ahead, close to 0 or to 1256."}
  - {addr: 210, escribe: "The engine, in the shots phase, when one hits you from the front: its type, as in [[.shflav]]. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−8 to −1 depending on the type, or 1 to 1000 if it was a memory shot; 0 if nothing hit you from the front."}
  - {addr: 211, escribe: "The engine, in the shots phase, when one hits you from behind: its type, as in [[.shflav]]. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−8 to −1 depending on the type, or 1 to 1000 if it was a memory shot; 0 if nothing hit you from behind."}
  - {addr: 212, escribe: "The engine, in the shots phase, when one hits you from the right: its type, as in [[.shflav]]. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−8 to −1 depending on the type, or 1 to 1000 if it was a memory shot; 0 if nothing hit you from the right."}
  - {addr: 213, escribe: "The engine, in the shots phase, when one hits you from the left: its type, as in [[.shflav]]. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−8 to −1 depending on the type, or 1 to 1000 if it was a memory shot; 0 if nothing hit you from the left."}
  - {addr: 477, escribe: "The engine, in the actions phase of every cycle: 1 if the bot your focus eye sees is anchored with [[.fixpos]], or if the shape it sees is still. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 or 1."}
  - {addr: 685, escribe: "The engine, in the actions phase of every cycle: 0 if your focus eye sees a bot, 1 if it sees a shape. In the forces and collisions phase, 1 if you collide with a shape while seeing nothing. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 or 1; if you see nothing it is 0, unless you collide with a shape, which sets it to 1."}
  - {addr: 686, escribe: "The engine, in the actions phase of every cycle: 1 if the bot your focus eye sees is part of a multibot. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 or 1."}
  - {addr: 687, escribe: "The engine, in the actions phase of every cycle, with the shell ([[.shell]]) of the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000."}
  - {addr: 688, escribe: "The engine, in the actions phase of every cycle, with the [[.body]] of the bot your focus eye sees, even if it is a corpse. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000."}
  - {addr: 689, escribe: "The engine, in the actions phase of every cycle, with the x published by the bot your focus eye sees; with a shape, a point on it. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 31999, in the same units as [[.xpos]]."}
  - {addr: 690, escribe: "The engine, in the actions phase of every cycle, with the y published by the bot your focus eye sees; with a shape, a point on it. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 31999, in the same units as [[.ypos]]; it grows downward."}
  - {addr: 695, escribe: "The engine, in the actions phase of every cycle: how fast what your focus eye sees is moving relative to you, regardless of direction. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000; it is never negative."}
  - {addr: 696, escribe: "The engine, in the actions phase of every cycle: it is [[.refveldx]] with the sign flipped, positive if what you see is moving off to your left. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−32000 to 32000.", nota: "In the original DarwinBots it was always 0. The port fixed it."}
  - {addr: 697, escribe: "The engine, in the actions phase of every cycle: the sideways velocity of what your focus eye sees, minus your [[.veldx]]. Positive, toward your right. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−32000 to 32000."}
  - {addr: 698, escribe: "The engine, in the actions phase of every cycle: it is [[.refvel]] with the sign flipped, positive if what you see is coming closer to you. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−32000 to 32000."}
  - {addr: 699, escribe: "The engine, in the actions phase of every cycle: the velocity of what your focus eye sees along your viewing direction, minus your [[.velup]]. Positive if it is moving away. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "−32000 to 32000."}
  - {addr: 701, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.up]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 702, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.dn]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 703, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.sx]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 704, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.dx]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 705, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.aimdx]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 706, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.aimsx]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 707, escribe: "The engine, in the actions phase of every cycle: how many commands writing to [[.shoot]] the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 708, escribe: "The engine, in the actions phase of every cycle: how many reads of its eyes, from `*.eye1` to `*.eye9`, the DNA of the bot your focus eye sees has, whether or not they run. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 709, escribe: "The engine, in the actions phase of every cycle, with the energy of the bot your focus eye sees, rounded; even if it is a corpse. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000."}
  - {addr: 710, escribe: "The engine, in the actions phase of every cycle, with the age in cycles of the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000; older than that, it stays at 32000."}
  - {addr: 711, escribe: "The engine, in the actions phase of every cycle, with the heading ([[.aim]]) of the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "Almost always 0 to 1255 (a full turn is 1256); while the other bot is turning it can overshoot a little."}
  - {addr: 712, escribe: "The engine, in the actions phase of every cycle: how many times the number 330 ([[.tie]]) appears in the DNA of the bot your focus eye sees, anywhere. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to about 16000; 0 if you see a corpse or a shape."}
  - {addr: 713, escribe: "The engine, in the actions phase of every cycle, with the poison stored ([[.poison]]) by the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000."}
  - {addr: 714, escribe: "The engine, in the actions phase of every cycle, with the venom stored ([[.venom]]) by the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000."}
  - {addr: 715, escribe: "The engine, in the actions phase of every cycle, with the kills ([[.kills]]) caused by the bot your focus eye sees. Also on colliding with a bot. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "0 to 32000; the port doesn't let it go past that."}
  - {addr: 900, escribe: "Your DNA.", lee: "The engine, in the actions phase, when a shot of yours goes out: if it is not 0, the shot goes out backward. If you also set [[.aimshoot]], that one wins.", borra: "The engine, when a shot of yours goes out, even a virus ([[.mkvirus]]) or an automatic waste discharge. If you don't shoot, it stays set.", rango: "−32000 to 32000; only whether it is 0 or not matters."}
  - {addr: 901, escribe: "Your DNA.", lee: "The engine, in the actions phase, when a shot of yours goes out: it deflects it by that angle from your front, positive toward the right.", borra: "The engine, when a shot of yours goes out, even a virus ([[.mkvirus]]) or an automatic waste discharge. If you don't shoot, it stays set.", rango: "−32000 to 32000; only the remainder of dividing by 1256, which is one full turn, counts."}
