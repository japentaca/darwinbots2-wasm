# Plain-English entries: defenses (slime, shell, venom, poison) and ties
registros:
  - {addr: 820, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: makes up to 200 slime (or takes it apart, if negative) and charges 1 energy per 10, plus a surcharge that goes to waste (parameter [[param:cost:28]]).", borra: "The engine, after making. With energy at 0 or less, the command stays written without being carried out.", rango: "−32000 to 32000; at most 200 per cycle are used in each direction"}
  - {addr: 821, escribe: "The engine: in the forces and collisions phase, after evaporating 2%; and in the actions phase, when you make slime. You read it in the next cycle.", borra: "The engine recalculates it every cycle; writing to it changes nothing.", rango: "0 to 32000"}
  - {addr: 822, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: makes up to 100 shell (or takes it apart, if negative) and charges 1 energy per 10, plus a surcharge that goes to waste (parameter [[param:cost:29]]).", borra: "The engine, after making. With energy at 0 or less, the command stays written without being carried out.", rango: "−32000 to 32000; at most 100 per cycle are used in each direction"}
  - {addr: 823, escribe: "The engine: when you make shell (actions phase), when a shot that wears it down hits you (the shots phase) and when you or a tie partner share shell (movement phase).", borra: "Nobody: it shows the latest change. Writing to it changes nothing.", rango: "0 to 32000"}
  - {addr: 824, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: makes up to 100 venom (or takes it apart, if negative) and charges 1 energy per 1, plus a surcharge that goes to waste (parameter [[param:cost:26]]).", borra: "The engine, after making. With energy at 0 or less, the command stays written without being carried out.", rango: "−32000 to 32000; at most 100 per cycle are used in each direction"}
  - {addr: 825, escribe: "The engine: when you make or fire venom (actions phase), when you pass it along or take it through a tie (movement phase) and when venom from your own species reaches you (the shots phase).", borra: "Nobody: venom does not get used up by itself. Writing to it changes nothing.", rango: "0 to 32000"}
  - {addr: 826, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: makes up to 100 poison (or takes it apart, if negative) and charges 1 energy per 4, plus a surcharge that goes to waste (parameter [[param:cost:27]]).", borra: "The engine, after making. With energy at 0 or less, the command stays written without being carried out.", rango: "−32000 to 32000; at most 100 per cycle are used in each direction"}
  - {addr: 827, escribe: "The engine: in the forces and collisions phase, after evaporating 2%; also when you make poison (actions) and when your poison goes out against an attacker (the shots phase or a tie). You read it in the next cycle.", borra: "The engine recalculates it every cycle; writing to it changes nothing.", rango: "0 to 32000"}
  - {addr: 830, escribe: "Your DNA.", lee: "The engine, in the movement phase: for every tie you created, it leaves you that percentage of the energy pooled with the partner. Only if you are multicellular.", borra: "The engine, every cycle, whether you use it or not.", rango: "−32000 to 32000; counts from 1 to 100 (the remainder of dividing by 100; a multiple of 100 counts as 100); 0 or negative does nothing"}
  - {addr: 831, escribe: "Your DNA.", lee: "The engine, in the movement phase: for every tie you created, it leaves you that percentage of the waste pooled with the partner. Only if you are multicellular.", borra: "The engine, every cycle, whether you use it or not.", rango: "−32000 to 32000; counts from 1 to 99 (100 or more counts as 99); 0 or negative does nothing"}
  - {addr: 832, escribe: "Your DNA.", lee: "The engine, in the movement phase: for every tie you created, it leaves you that percentage of the shell pooled with the partner. Only if you are multicellular.", borra: "The engine, every cycle, whether you use it or not.", rango: "−32000 to 32000; counts from 1 to 99 (100 or more counts as 99); 0 or negative does nothing"}
  - {addr: 833, escribe: "Your DNA.", lee: "The engine, in the movement phase: for every tie you created, it leaves you that percentage of the slime pooled with the partner. Only if you are multicellular.", borra: "The engine, every cycle, whether you use it or not.", rango: "−32000 to 32000; counts from 1 to 99 (100 or more counts as 99); 0 or negative does nothing"}
  - {addr: 834, escribe: "Your DNA.", lee: "The engine, when your poison goes out toward whoever attacked you: it is the attacker's cell where your [[.pval]] will be written while the poisoning lasts.", borra: "Nobody: it is configuration. A child is born with 0.", rango: "−32000 to 32000; 1 to 1000 work (a larger value is brought down to that range, 0 or negative picks at random and address 340 is left alone)"}
  - {addr: 835, escribe: "Your DNA.", lee: "The engine, when you fire venom or pass it along a tie: it is the victim's cell where your [[.venval]] will be written while the paralysis lasts.", borra: "Nobody: it is configuration. A child is born with 0.", rango: "−32000 to 32000; 1 to 1000 work (a larger value is brought down to that range, 0 or negative picks at random and address 340 is left alone)"}
  - {addr: 836, escribe: "Your DNA.", lee: "The engine, when you fire venom or pass it along a tie: it travels with the hit and is written to the victim's [[.vloc]] cell every cycle of the paralysis.", borra: "Nobody: it is configuration. A child is born with 0.", rango: "−32000 to 32000"}
  - {addr: 837, escribe: "The engine, every cycle, in the forces and collisions phase: the cycles of paralysis you have left. You read it in the next cycle.", borra: "The engine recalculates it every cycle; it is 0 if you are not paralyzed.", rango: "0 to 32000"}
  - {addr: 838, escribe: "The engine, every cycle, in the forces and collisions phase: the cycles of poisoning you have left. You read it in the next cycle.", borra: "The engine recalculates it every cycle; it is 0 if you are not poisoned.", rango: "0 to 32000"}
  - {addr: 839, escribe: "Your DNA.", lee: "The engine, when your poison goes out toward whoever attacked you: it travels with the poison and is written to the attacker's [[.ploc]] cell every cycle of the poisoning.", borra: "Nobody: it is configuration. A child is born with 0.", rango: "−32000 to 32000"}
  - {addr: 330, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: if a bot is within reach, it tries to tie you to it and the number becomes the tie port. It charges energy whether it succeeds or not (parameter [[param:cost:22]]).", borra: "The engine, whenever it was not 0, whether or not the tie forms.", rango: "−32000 to 32000; 0 is not a command"}
  - {addr: 331, escribe: "Your DNA.", lee: "The engine, in the movement phase: sets the stiffness of the tie chosen with [[.tienum]] (or that of [[.tiepres]]), at both ends. Only stiffened ties of a multicellular organism.", borra: "The engine, after using it. If you have no ties, or [[.tienum]] and [[.tiepres]] are 0, it stays written.", rango: "−32000 to 32000; counts from 1 to 100 (the remainder of dividing by 100; a multiple of 100 counts as 100 and a negative counts as 1); 0 is not a command"}
  - {addr: 450, escribe: "The engine, in the actions phase: the angle to the partner of the [[.tiepres]] tie, or 0 if there is none. You read it in the next cycle.", borra: "The engine recalculates it every cycle; writing to it changes nothing.", rango: "−628 to 628 (half a turn each way)"}
  - {addr: 451, escribe: "The engine, in the actions phase: the edge-to-edge length of the [[.tiepres]] tie, or 0 if there is none. You read it in the next cycle.", borra: "The engine recalculates it every cycle; writing to it changes nothing.", rango: "from about −240 (overlapping bots) up to 32000"}
  - {addr: 452, escribe: "Your DNA.", lee: "The engine. With 1 to 1000, in the forces and collisions phase it writes [[.tieval]] to that cell of the tied bot (requires [[.tienum]] to be other than 0). With `-1`, `-3`, `-4` or `-6`, it transfers in the movement phase.", borra: "The engine, together with [[.tieval]], when it carries out the command. A write with no tie on that port stays written; so does a transfer, if you have no ties or no tie is chosen.", rango: "−32000 to 32000; 1 to 1000 and `-1`, `-3`, `-4` and `-6` work"}
  - {addr: 453, escribe: "Your DNA.", lee: "The engine, together with [[.tieloc]]: it is the number written to the other bot, or the amount transferred (positive gives, negative takes).", borra: "The engine, together with [[.tieloc]], when the command is carried out.", rango: "−32000 to 32000; transfers have a per-cycle cap (see [[.tieloc]])"}
  - {addr: 454, escribe: "The engine, when a tie of yours forms: the number you put in [[.tie]], or its sequence number if you were tied. If that tie breaks, it moves to the previous one in your list.", borra: "The engine, when the tie it pointed to breaks and there is no previous one in your list. If you write it yourself, your value stays.", rango: "−32000 to 32000 (the port); 0 is “no tie chosen”"}
  - {addr: 455, escribe: "Your DNA.", lee: "The engine, in the same cycle: picks by its port the tie used by [[.tieloc]], [[.fixang]], [[.fixlen]] and [[.stifftie]]. With 0 it uses that of [[.tiepres]], except for writing to the other bot with a positive [[.tieloc]].", borra: "The engine, every cycle, in the movement phase. If you have no ties, it stays written.", rango: "−32000 to 32000; 0 is “the one in [[.tiepres]]”"}
  - {addr: 466, escribe: "The engine, when a tie forms or breaks and every cycle when it checks your ties (movement phase).", borra: "The engine, when you are left with no ties. Writing to it changes nothing.", rango: "0 to 9"}
  - {addr: 467, escribe: "Your DNA.", lee: "The engine, in the movement phase: breaks, on both sides, your tie with that port.", borra: "The engine, after using it. If you have no ties, it stays written.", rango: "−32000 to 32000; 0 is not a command"}
  - {addr: 468, escribe: "Your DNA. A child is born with 32000, which means “no command”.", lee: "The engine, in the movement phase: with 0 or more it sets the angle of the chosen tie (taken modulo 1256); with a negative it releases it. Only stiffened ties.", borra: "The engine sets it back to 32000, not 0, after using it. If you have no ties, or [[.tienum]] and [[.tiepres]] are 0, it stays written.", rango: "−32000 to 32000; 32000 is “no command”"}
  - {addr: 469, escribe: "Your DNA.", lee: "The engine, in the movement phase: the chosen tie takes that natural length, edge to edge and unsigned, at both ends. Only stiffened ties.", borra: "The engine, after using it; the new length stays. If you have no ties, or [[.tienum]] and [[.tiepres]] are 0, it stays written.", rango: "−32000 to 32000; it is taken unsigned and 0 does nothing"}
  - {addr: 470, escribe: "The engine: 1 when one of your ties stiffens (forces and collisions phase); 0 when you are left with no ties (movement phase).", borra: "The engine, when you are left with no ties at all. Writing to it changes nothing.", rango: "0 or 1"}
  - {addr: 471, escribe: "Your DNA.", lee: "The engine, at the end of the forces and collisions phase: picks by its port the tie that the tref* cells come from. With 0 it uses that of [[.tiepres]].", borra: "Nobody: it stays until you change it. A child is born with 0.", rango: "−32000 to 32000; 0 is “the one in [[.tiepres]]”"}
  - {addr: 480, escribe: "Your DNA and the engine. Writing it with [[op:store]] (or another two-operand store) sets the angle of the first tie in the movement phase; after that the engine writes the measured angle, which you read in the next cycle.", borra: "The engine rewrites it every cycle, only if you are multicellular, the first tie is stiffened and [[.tienum]] or [[.tiepres]] is not 0.", rango: "0 to 1256"}
  - {addr: 481, escribe: "Your DNA and the engine, as in [[.tieang1]], for the second tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tieang1]].", rango: "0 to 1256"}
  - {addr: 482, escribe: "Your DNA and the engine, as in [[.tieang1]], for the third tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tieang1]].", rango: "0 to 1256"}
  - {addr: 483, escribe: "Your DNA and the engine, as in [[.tieang1]], for the fourth tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tieang1]].", rango: "0 to 1256"}
  - {addr: 484, escribe: "Your DNA and the engine. Writing it with [[op:store]] (or another two-operand store) sets the natural length of the first tie, signed, in the movement phase; after that the engine writes the measured length, which you read in the next cycle.", borra: "The engine rewrites it every cycle, only if you are multicellular, the first tie is stiffened and [[.tienum]] or [[.tiepres]] is not 0.", rango: "from about −240 (overlapping bots) up to 32000"}
  - {addr: 485, escribe: "Your DNA and the engine, as in [[.tielen1]], for the second tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tielen1]].", rango: "from about −240 (overlapping bots) up to 32000"}
  - {addr: 486, escribe: "Your DNA and the engine, as in [[.tielen1]], for the third tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tielen1]].", rango: "from about −240 (overlapping bots) up to 32000"}
  - {addr: 487, escribe: "Your DNA and the engine, as in [[.tielen1]], for the fourth tie.", borra: "The engine rewrites it every cycle, under the same conditions as [[.tielen1]].", rango: "from about −240 (overlapping bots) up to 32000"}
