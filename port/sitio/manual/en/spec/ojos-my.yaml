# Plain-English entries: eyes (eye*, eyef, focuseye, eye*dir, eye*width) and my* counters
registros:
  - {addr: 501, escribe: "The engine, in the actions phase of every cycle, with what the eye that looks 40 degrees to the left by default sees. You read it in the next cycle.", borra: "The engine, every cycle, before looking again: if the eye sees nothing, it stays at 0.", rango: "0 to 32000: 0 means seeing nothing, 1 is the edge of the range and 32000 is touching."}
