# Plain-English entries: body, energy, waste, chloroplasts, reproduction, viruses and genes
registros:
  - {addr: 9, escribe: "The engine, in the actions phase: the bot's age. It overwrites whatever you write. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000: 0 in the first cycle of life; on reaching 32000 it stays there."}
  - {addr: 10, escribe: "The engine, in the movement phase, before the purchases and conversions of the actions phase. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "1 to 32000; it comes from the body, the shell and above all the chloroplasts.", nota: "A freshly loaded bot reads it as 0 in its first cycle."}
  - {addr: 12, escribe: "The engine adds 1 to it in the actions phase; after 32000 it continues at −32000. Your DNA can write it too. On load it starts at random and the child inherits it.", borra: "No: the engine never sets it to 0.", rango: "−32000 to 32000."}
  - {addr: 220, escribe: "The engine, only when this bot kills another: with a shot, in the shots phase; through a tie, in the movement phase.", borra: "No. If you write another number, it stays until the next kill; then the engine puts its own count back.", rango: "0 to 32000."}
  - {addr: 300, escribe: "Your DNA.", lee: "The engine, in the actions phase: if it is greater than 0, it requests a child, which is born in the births and deaths phase of the same cycle.", borra: "The engine, only when the child is born. If the birth fails, it stays written and is retried every cycle.", rango: "−32000 to 32000; the remainder of dividing by 100 is used: the percentage the child takes (100 counts as 0)."}
  - {addr: 301, escribe: "Your DNA.", lee: "The engine, same as [[.repro]]; in addition, the child mutates at birth with probabilities ten times higher than normal.", borra: "The engine, only when the child is born. If the birth fails, it stays written.", rango: "−32000 to 32000; the remainder of dividing by 100 is used."}
  - {addr: 302, escribe: "Your DNA.", lee: "The engine, in the actions phase, if it is greater than 0 and the bot is fertilized: requests a sexual child with that percentage. That cycle, [[.repro]] waits.", borra: "The engine, only when the child is born. If the birth fails, it stays written.", rango: "−32000 to 32000; the remainder of dividing by 100 is used."}
  - {addr: 303, escribe: "The engine sets it to 10 when a sperm arrives, in the shots phase, and lowers it by 1 in the actions phase.", borra: "The engine, when the fertilization expires and after a sexual birth. If the bot rejects the sperm, it stays frozen.", rango: "0 to 10; in practice you read 9 the cycle after the sperm and then it counts down to 0.", nota: "Writing it does not fertilize the bot. Outside a fertilization the engine does not touch it: whatever you write stays there."}
  - {addr: 310, escribe: "The engine, in the actions phase; also at birth, for the parent and the child. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000; internally it can go negative, but you never read it that way.", nota: "A freshly loaded bot reads it as 0 in its first cycle; a child, by contrast, is born with its energy already published."}
  - {addr: 311, escribe: "The engine, in the actions phase, after the [[.strbody]] and [[.fdbody]] conversions; also when giving birth, for the parent. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000.", nota: "In its first cycle of life the bot reads it as 0, whether you loaded it or it was just born."}
  - {addr: 312, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: takes that energy out of the body, at 10 energy per point.", borra: "The engine, after using it. A negative value is also cleared, with no effect.", rango: "−32000 to 32000; only 1 to 100 count (more than 100 counts as 100)."}
  - {addr: 313, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: moves that energy into the body, 1 body for every 10 energy. It does not check whether you have enough.", borra: "The engine, after using it. A negative value is also cleared, with no effect.", rango: "−32000 to 32000; only 1 to 100 count (more than 100 counts as 100)."}
  - {addr: 314, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle, if it is not 0: adds the value divided by 32000 to the buoyancy, which stays between 0 and 1.", borra: "The engine, after using it.", rango: "−32000 to 32000; 32000 sweeps the whole buoyancy range, from 0 to 1."}
  - {addr: 315, escribe: "The engine, in the actions phase, only in the cycles where [[.setboy]] is not 0. You read it in the next cycle.", borra: "No: it keeps the last value until the next [[.setboy]].", rango: "0 to 32000: the buoyancy from 0 to 1.", nota: "A child inherits the parent's buoyancy, but reads 0 until it writes [[.setboy]] for the first time."}
  - {addr: 335, escribe: "Your DNA.", lee: "The engine, in the movement phase of the same cycle: if there is no virus, it copies that gene into a new virus and charges [[param:cost:25]] per word. If the bot has chloroplasts, it loses them and makes no virus.", borra: "The engine, only when the virus fires; while it incubates, the cell keeps the gene number.", rango: "−32000 to 32000; only the number of a gene that exists is valid."}
  - {addr: 336, escribe: "The engine, every cycle in the movement phase, and also when the bot is loaded, at birth, on mutation, when a gene is deleted or when a virus is received.", borra: "No: the engine rewrites it every cycle, so writing to it is pointless.", rango: "1 to 32001: the DNA words plus the final end."}
  - {addr: 337, escribe: "The engine, every cycle in the movement phase. It publishes it before making, so the cycle after [[.mkvirus]] you still read 0.", borra: "No: the engine rewrites it every cycle; it goes back to 0 when the virus fires.", rango: "0 to 32000: 0 with no virus, more than 1 while incubating, 1 ready to fire."}
  - {addr: 338, escribe: "Your DNA. A negative value is taken as 1.", lee: "The engine, in the movement phase: if it is not 0 and [[.vtimer]] is 1, it fires the virus with that strength.", borra: "The engine, on firing. If the virus is not ready, the command stays written until it is.", rango: "−32000 to 32000: the strength of the shot."}
  - {addr: 339, escribe: "The engine, every cycle in the movement phase, and also when the bot is loaded, at birth, on mutation, when a gene is deleted or when a virus is received.", borra: "No: the engine rewrites it every cycle, so writing to it is pointless.", rango: "0 to 32000."}
  - {addr: 340, escribe: "Your DNA.", lee: "The engine, in the movement phase of the same cycle: if it is greater than 0, it deletes that gene.", borra: "The engine, after using it. A negative value does nothing and stays written.", rango: "−32000 to 32000; only the number of a gene that exists is valid.", nota: "No outside attack can write it: memory shots skip it and venom cannot target it."}
  - {addr: 341, escribe: "The engine, while the DNA runs, every time it passes a cond, start, else or stop.", borra: "No: the engine overwrites it at the next gene marker.", rango: "0 up to the number of genes in the bot."}
  - {addr: 828, escribe: "The engine, in the actions phase; if they exceeded 32000, after expelling them. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000."}
  - {addr: 829, escribe: "The engine, in the actions phase. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle, and it never goes down except on reproduction.", rango: "0 to 32000."}
  - {addr: 920, escribe: "The engine, in the actions phase, after the purchases, the removals and the natural loss of the cycle. You read it in the next cycle.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000.", nota: "A freshly loaded bot reads it as 0 in its first cycle, even if it is a vegetable."}
  - {addr: 921, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: adds those chloroplasts and charges [[param:cost:8]] for each one. If the bot would be left with less than 100 energy, it buys nothing.", borra: "The engine, after using it. A negative value does nothing and stays written, unless [[.rmchlr]] is used that cycle.", rango: "−32000 to 32000; only positive values count."}
  - {addr: 922, escribe: "Your DNA.", lee: "The engine, in the actions phase of the same cycle: removes those chloroplasts, without charging or refunding any energy.", borra: "The engine, after using it. A negative value does nothing and stays written, unless [[.mkchlr]] is used that cycle.", rango: "−32000 to 32000; only positive values count."}
  - {addr: 923, escribe: "The engine, in the actions phase: the part of the field that the bots do not cover. It is only recalculated during the day; at night it repeats the last value.", borra: "No: the engine rewrites it every cycle.", rango: "0 to 32000: 32000 is an empty field.", nota: "A freshly loaded bot reads it as 0 in its first cycle."}
  - {addr: 924, escribe: "Your DNA.", lee: "The engine, in the movement phase of the same cycle, only in a multicellular organism: shares through every tie this bot created.", borra: "The engine, every cycle in the movement phase, in all bots.", rango: "−32000 to 32000; only 1 to 99 count (more than 99 counts as 99)."}
