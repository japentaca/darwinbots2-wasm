# Plain-English entries: what it feels through a tie (tref*), memory spying, address 0 and genetic memory
registros:
  - {addr: 0, escribe: "Only the engine, in the forces and collisions phase: if a venom or a poison targets [[.delgene]] (340), the effect lands here.", borra: "Nobody. Nobody reads it either.", rango: "−32000 to 32000", nota: "Your DNA can't reach it: `*0` reads cell 1000 and a store to 0 does nothing and charges no energy."}
  - {addr: 437, escribe: "The engine, in the forces and collisions phase: it copies the [[.body]] of the tied bot, rounded. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to 32000; if the other has 32000 or more, you read 32000"}
  - {addr: 438, escribe: "The engine, in the forces and collisions phase: it copies the [[.xpos]] published by the tied bot. You read it in the next cycle, one cycle behind what the other reads of itself.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to 31999"}
  - {addr: 439, escribe: "The engine, in the forces and collisions phase: it copies the [[.ypos]] published by the tied bot. You read it in the next cycle, one cycle behind what the other reads of itself.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to 31999; it grows toward the bottom of the map"}
  - {addr: 440, escribe: "The engine, in the forces and collisions phase: it is [[.trefvelmydx]] with the sign flipped. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "About −23000 to 23000; in practice, much less"}
  - {addr: 441, escribe: "The engine, in the forces and collisions phase: it projects the velocity of the tied bot onto your rightward axis and subtracts your [[.veldx]]. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "About −23000 to 23000; in practice, much less"}
  - {addr: 442, escribe: "The engine, in the forces and collisions phase: it is [[.trefvelmyup]] with the sign flipped. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "About −23000 to 23000; in practice, much less"}
  - {addr: 443, escribe: "The engine, in the forces and collisions phase: it projects the velocity of the tied bot onto your forward axis and subtracts your [[.velup]]. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "About −23000 to 23000; in practice, much less"}
  - {addr: 444, escribe: "The engine, in the forces and collisions phase: it copies the [[.velscalar]] published by the tied bot. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to 32000"}
