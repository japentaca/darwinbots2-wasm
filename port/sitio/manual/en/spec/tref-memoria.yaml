  - {addr: 463, escribe: "The engine, in the forces and collisions phase: it copies the count of eye reads in the DNA of the tied bot (its [[.myeye]]). You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to about 16000; in practice, a few units"}
  - {addr: 464, escribe: "The engine, in the forces and collisions phase: it copies the energy ([[.nrg]]) of the tied bot, rounded. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "−32000 to 32000; if the other has 32000 or more, you read 32000"}
  - {addr: 465, escribe: "The engine, in the forces and collisions phase: it copies the age of the tied bot. You read it in the next cycle, and it equals what the other bot reads in its own [[.robage]] in that cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 with no tie; with a tie, 1 to 32000"}
  - {addr: 473, escribe: "The engine copies cell [[.memloc]] of the bot you see, in the actions phase; and of the bot you collide with, in the forces and collisions phase. You read it in the next cycle.", borra: "The engine, every cycle, when the senses are cleared.", rango: "Whatever the spied cell holds: −32000 to 32000. It is 0 if you don't see a bot."}
  - {addr: 474, escribe: "Your DNA.", lee: "The engine, every time it fills [[.memval]] with the bot you see. It only uses addresses 1 to 1000.", borra: "Nobody: it stays until you change it. A child is born with 0.", rango: "−32000 to 32000; only 1 to 1000 are useful, with no range adjustment"}
  - {addr: 475, escribe: "The engine, in the forces and collisions phase: it copies cell [[.tmemloc]] of the tied bot. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for. With [[.tmemloc]] outside 1 to 1000, the last value stays.", rango: "Whatever the spied cell holds: −32000 to 32000"}
  - {addr: 476, escribe: "Your DNA.", lee: "The engine, in the forces and collisions phase, when it fills [[.tmemval]] with the tied bot. It only uses addresses 1 to 1000.", borra: "Nobody, not even when the tie is lost. A child is born with 0.", rango: "−32000 to 32000; only 1 to 1000 are useful, with no range adjustment"}
  - {addr: 478, escribe: "The engine, in the forces and collisions phase: 1 if the tied bot is fixed ([[.fixed]]), 0 if not. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 or 1"}
  - {addr: 479, escribe: "The engine, in the forces and collisions phase: it copies the [[.aim]] published by the tied bot. You read it in the next cycle, one cycle behind what the other reads of itself.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to 1255; it can overshoot a little if the other turns for other reasons", nota: ""}
