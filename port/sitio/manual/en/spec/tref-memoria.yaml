  - {addr: 449, escribe: "The engine, in the forces and collisions phase: it copies the [[.shell]] of the tied bot, rounded. You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for, just like the other tref* sysvars.", rango: "0 to 32000"}
  - {addr: 456, escribe: "The engine, in the forces and collisions phase: it copies the count of writes to [[.up]] in the DNA of the tied bot (its [[.myup]]). You read it in the next cycle.", borra: "The engine, when you run out of ties or don't have the tie that [[.readtie]] asks for.", rango: "0 to about 16000; in practice, a few units"}
