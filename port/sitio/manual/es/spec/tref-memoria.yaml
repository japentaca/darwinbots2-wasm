# Fichas en castellano llano: lo que se siente por un lazo (tref*), espionaje de memoria, dirección 0 y memoria genética
registros:
  - {addr: 0, escribe: "Solo el motor, en la fase de fuerzas y choques: si un veneno o una toxina apunta a [[.delgene]] (340), el efecto cae acá.", borra: "Nadie. Nadie la lee tampoco.", rango: "−32000 a 32000", nota: "Tu ADN no la alcanza: `*0` lee la celda 1000 y un store a 0 no hace nada ni cobra energía."}
  - {addr: 437, escribe: "El motor, en la fase de fuerzas y choques: copia el [[.body]] del bot atado, redondeado. Lo leés en el ciclo siguiente.", borra: "El motor, cuando te quedás sin lazos o no tenés el lazo que pide [[.readtie]].", rango: "0 a 32000; si el otro tiene 32000 o más, leés 32000"}
