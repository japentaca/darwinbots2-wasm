  - {addr: 473, escribe: "El motor copia la celda [[.memloc]] del bot que ves, en la fase de acciones; y del bot con el que chocás, en la de fuerzas y choques. Lo leés en el ciclo siguiente.", borra: "El motor, en cada ciclo, cuando se borran los sentidos.", rango: "Lo que tenga la celda espiada: −32000 a 32000. Vale 0 si no ves un bot."}
  - {addr: 474, escribe: "Tu ADN.", lee: "El motor, cada vez que llena [[.memval]] con el bot que ves. Solo usa direcciones de 1 a 1000.", borra: "Nadie: queda hasta que la cambies. Un hijo nace con 0.", rango: "−32000 a 32000; solo sirven de 1 a 1000, sin ajuste de rango"}
  - {addr: 475, escribe: "El motor, en la fase de fuerzas y choques: copia la celda [[.tmemloc]] del bot atado. Lo leés en el ciclo siguiente.", borra: "El motor, cuando te quedás sin lazos o no tenés el lazo que pide [[.readtie]]. Con [[.tmemloc]] fuera de 1 a 1000, queda el último valor.", rango: "Lo que tenga la celda espiada: −32000 a 32000"}
  - {addr: 476, escribe: "Tu ADN.", lee: "El motor, en la fase de fuerzas y choques, al llenar [[.tmemval]] con el bot atado. Solo usa direcciones de 1 a 1000.", borra: "Nadie, ni siquiera al perder el lazo. Un hijo nace con 0.", rango: "−32000 a 32000; solo sirven de 1 a 1000, sin ajuste de rango"}
  - {addr: 478, escribe: "El motor, en la fase de fuerzas y choques: 1 si el bot atado está fijo ([[.fixed]]), 0 si no. Lo leés en el ciclo siguiente.", borra: "El motor, cuando te quedás sin lazos o no tenés el lazo que pide [[.readtie]].", rango: "0 o 1"}
