# Fichas en castellano llano: movimiento, posición y sentidos del cuerpo
registros:
  - {addr: 1, escribe: "Tu ADN.", lee: "El motor, en la fase de fuerzas y choques del mismo ciclo. No empuja a un bot fijo ni a una especie con el movimiento por ADN desactivado.", borra: "El motor, siempre, en la fase de movimiento del mismo ciclo.", rango: "−32000 a 32000; el empujón por la masa se recorta a [[.maxvel]]."}
  - {addr: 2, escribe: "Tu ADN.", lee: "El motor, en la fase de fuerzas y choques del mismo ciclo, restándola de [[.up]].", borra: "El motor, siempre, en la fase de movimiento del mismo ciclo.", rango: "−32000 a 32000; un negativo empuja hacia adelante."}
  - {addr: 3, escribe: "Tu ADN.", lee: "El motor, en la fase de fuerzas y choques del mismo ciclo, restándole [[.dx]].", borra: "El motor, siempre, en la fase de movimiento del mismo ciclo.", rango: "−32000 a 32000; un negativo empuja hacia la derecha."}
  - {addr: 4, escribe: "Tu ADN.", lee: "El motor, en la fase de fuerzas y choques del mismo ciclo, restándola de [[.sx]].", borra: "El motor, siempre, en la fase de movimiento del mismo ciclo.", rango: "−32000 a 32000; un negativo empuja hacia la izquierda."}
  - {addr: 5, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento del mismo ciclo. Se ignora si escribiste en [[.setaim]] un rumbo distinto del actual.", borra: "El motor, en la fase de movimiento del mismo ciclo, después de girar.", rango: "−32000 a 32000; 1256 es una vuelta y un negativo gira a la izquierda."}
  - {addr: 6, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento del mismo ciclo. Se ignora si escribiste en [[.setaim]] un rumbo distinto del actual.", borra: "El motor, en la fase de movimiento del mismo ciclo, después de girar.", rango: "−32000 a 32000; 1256 es una vuelta y un negativo gira a la derecha."}
  - {addr: 11, escribe: "El motor, en la fase de movimiento de cada ciclo: el tope de velocidad de la configuración. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo. Escribir en ella no cambia nada.", rango: "El de [[param:opt:11]]; por defecto 40. Vale 0 en el primer ciclo de vida."}
  - {addr: 18, escribe: "El motor, en la fase de movimiento, después de girar al bot. Lo leés en el ciclo siguiente; los demás lo ven en [[.refaim]].", borra: "Nadie; el motor la reescribe en cada ciclo. Escribir en ella no gira al bot.", rango: "0 a 1255 (1256 es una vuelta); puede salirse un poco si algo más hace girar al bot. Vale 0 en el primer ciclo de vida."}
  - {addr: 19, escribe: "Tu ADN. El motor la siembra al nacer con el rumbo del bot. En el modo Player Bot, el rumbo hacia el ratón pisa lo que escribió tu ADN.", borra: "No la borra: en la fase de movimiento, después de girar, el motor le copia el rumbo actual.", rango: "−32000 a 32000; se toma el resto de dividir por 1256. Solo gira si difiere del rumbo actual."}
  - {addr: 196, escribe: "El motor, en la fase de movimiento, después de mover al bot: la rapidez redondeada. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 a [[.maxvel]] (nunca más de 200). Vale 0 en el primer ciclo de vida."}
  - {addr: 197, escribe: "El motor, en la fase de movimiento, después de mover y girar al bot: [[.veldx]] con el signo cambiado. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "Entre menos y más [[.maxvel]]; positiva hacia la izquierda."}
  - {addr: 198, escribe: "El motor, en la fase de movimiento, después de mover y girar al bot: la velocidad de costado respecto del rumbo nuevo. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "Entre menos y más [[.maxvel]]; positiva hacia la derecha."}
  - {addr: 199, escribe: "El motor, en la fase de movimiento, después de mover y girar al bot: [[.velup]] con el signo cambiado. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "Entre menos y más [[.maxvel]]; positiva marcha atrás."}
  - {addr: 200, escribe: "El motor, en la fase de movimiento, después de mover y girar al bot: la velocidad hacia adelante respecto del rumbo nuevo. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "Entre menos y más [[.maxvel]]; positiva hacia adelante."}
  - {addr: 215, escribe: "El motor, en la fase de acciones de cada ciclo: 1 si el bot quedó fijo, 0 si no. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo. Escribir en ella no fija ni libera.", rango: "0 o 1."}
  - {addr: 216, escribe: "Tu ADN. Si la especie se cargó marcada como fija, el bot nace con 1.", lee: "El motor, en la fase de fuerzas y choques de cada ciclo, salvo que la simulación tenga desactivada la fijación.", borra: "Nunca: queda lo que escribiste hasta que lo cambies.", rango: "−32000 a 32000; más de 0 fija al bot, 0 o menos lo suelta."}
  - {addr: 214, escribe: "El motor, en la fase de fuerzas y choques: 1 si el bot toca una pared del mundo. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 217, escribe: "El motor, en la fase de acciones de cada ciclo: la altura del centro del bot desde el borde de arriba. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 a 31999; pasado 32000 vuelve a empezar desde 0. La configuración puede dividirla por un factor."}
  - {addr: 218, escribe: "El motor, al final del ciclo, en la fase del sol: 1 si hubo sol (y, con cloroplastos, si el bot está en la franja iluminada); si no, 0. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 o 1."}
  - {addr: 219, escribe: "El motor, en la fase de acciones de cada ciclo: la distancia del centro del bot al borde izquierdo. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 a 31999; pasado 32000 vuelve a empezar desde 0. La configuración puede dividirla por un factor."}
  - {addr: 400, escribe: "El motor, en la fase de acciones de cada ciclo: 1 si el bot apunta hacia arriba (rumbo entre 278 y 350), 0 si no. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 o 1."}
  - {addr: 401, escribe: "El motor, en la fase de acciones de cada ciclo: todos los bots del mundo, cadáveres y el propio incluidos. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 a 32000."}
  - {addr: 402, escribe: "El motor, en la fase de acciones de cada ciclo: los bots vivos de tu especie, incluido el propio. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "0 a 32000."}
  - {addr: 201, escribe: "El motor, en la fase de fuerzas y choques: 1 si el bot se superpone con otro bot o un obstáculo. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 205, escribe: "El motor, en la fase de fuerzas y choques: 1 si lo que toca está delante, a menos de unos 45 grados de su rumbo. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 206, escribe: "El motor, en la fase de fuerzas y choques: 1 si lo que toca está detrás, a menos de unos 45 grados de la dirección opuesta a su rumbo. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 207, escribe: "El motor, en la fase de fuerzas y choques: 1 si lo que toca está a su derecha, en el cuarto de vuelta centrado en ese costado. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 208, escribe: "El motor, en la fase de fuerzas y choques: 1 si lo que toca está a su izquierda, en el cuarto de vuelta centrado en ese costado. Lo leés en el ciclo siguiente.", borra: "El motor, cuando se borran los sentidos, justo después de tu ADN.", rango: "0 o 1."}
  - {addr: 221, escribe: "Nadie: el motor nunca la escribe. Funciona como memoria libre.", borra: "Nadie: conserva lo que guardes hasta que lo cambies.", rango: "−32000 a 32000; vale 0 al nacer."}
  - {addr: 194, escribe: "El motor, en la fase de acciones de cada ciclo: el cuerpo de ahora menos el de un ciclo antes. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "−32000 a 32000; negativo si perdió cuerpo."}
  - {addr: 195, escribe: "El motor, en la fase de acciones de cada ciclo: el cuerpo de un ciclo antes menos el de ahora. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "−32000 a 32000; negativo si ganó cuerpo."}
  - {addr: 203, escribe: "El motor, en la fase de acciones de cada ciclo: la energía de un ciclo antes menos la de ahora. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "−32000 a 32000; negativo si ganó energía."}
  - {addr: 204, escribe: "El motor, en la fase de acciones de cada ciclo: la energía de ahora menos la de un ciclo antes. Lo leés en el ciclo siguiente.", borra: "Nadie; el motor la reescribe en cada ciclo.", rango: "−32000 a 32000; negativo si perdió energía."}
