# Fichas en castellano llano: defensas (baba, caparazón, veneno, toxina) y lazos
registros:
  - {addr: 820, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: fabrica hasta 200 de baba (o desarma, si es negativo) y cobra 1 de energía por cada 10, más un recargo que va a desecho (parámetro [[param:cost:28]]).", borra: "El motor, después de fabricar. Con la energía en 0 o menos, la orden queda escrita sin ejecutarse.", rango: "−32000 a 32000; por ciclo se usan como mucho 200 para cada lado"}
  - {addr: 821, escribe: "El motor: en la fase de fuerzas y choques, después de evaporar un 2 %; y en la de acciones, cuando fabricás. Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; escribir en ella no cambia nada.", rango: "0 a 32000"}
  - {addr: 822, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: fabrica hasta 100 de caparazón (o desarma, si es negativo) y cobra 1 de energía por cada 10, más un recargo que va a desecho (parámetro [[param:cost:29]]).", borra: "El motor, después de fabricar. Con la energía en 0 o menos, la orden queda escrita sin ejecutarse.", rango: "−32000 a 32000; por ciclo se usan como mucho 100 para cada lado"}
  - {addr: 823, escribe: "El motor: cuando fabricás (fase de acciones), cuando te pega un disparo que lo gasta (los disparos) y cuando vos o un compañero reparten caparazón (fase de movimiento).", borra: "Nadie: muestra el último cambio. Escribir en ella no cambia nada.", rango: "0 a 32000"}
  - {addr: 824, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: fabrica hasta 100 de veneno (o desarma, si es negativo) y cobra 1 de energía por cada 1, más un recargo que va a desecho (parámetro [[param:cost:26]]).", borra: "El motor, después de fabricar. Con la energía en 0 o menos, la orden queda escrita sin ejecutarse.", rango: "−32000 a 32000; por ciclo se usan como mucho 100 para cada lado"}
  - {addr: 825, escribe: "El motor: cuando fabricás o disparás veneno (fase de acciones), cuando lo pasás o lo sacás por un lazo (fase de movimiento) y cuando te llega veneno de tu especie (los disparos).", borra: "Nadie: el veneno no se gasta solo. Escribir en ella no cambia nada.", rango: "0 a 32000"}
  - {addr: 826, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: fabrica hasta 100 de toxina (o desarma, si es negativo) y cobra 1 de energía por cada 4, más un recargo que va a desecho (parámetro [[param:cost:27]]).", borra: "El motor, después de fabricar. Con la energía en 0 o menos, la orden queda escrita sin ejecutarse.", rango: "−32000 a 32000; por ciclo se usan como mucho 100 para cada lado"}
  - {addr: 827, escribe: "El motor: en la fase de fuerzas y choques, después de evaporar un 2 %; también cuando fabricás (acciones) y cuando tu toxina sale contra un atacante (los disparos o un lazo). Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; escribir en ella no cambia nada.", rango: "0 a 32000"}
  - {addr: 830, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: por cada lazo que creaste, te deja ese porcentaje de la energía sumada con el compañero. Solo si sos multicelular.", borra: "El motor, en cada ciclo, la uses o no.", rango: "−32000 a 32000; cuenta de 1 a 100 (el resto de dividir por 100; un múltiplo de 100 vale 100); 0 o negativo no hace nada"}
  - {addr: 831, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: por cada lazo que creaste, te deja ese porcentaje del desecho sumado con el compañero. Solo si sos multicelular.", borra: "El motor, en cada ciclo, la uses o no.", rango: "−32000 a 32000; cuenta de 1 a 99 (100 o más vale 99); 0 o negativo no hace nada"}
  - {addr: 832, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: por cada lazo que creaste, te deja ese porcentaje del caparazón sumado con el compañero. Solo si sos multicelular.", borra: "El motor, en cada ciclo, la uses o no.", rango: "−32000 a 32000; cuenta de 1 a 99 (100 o más vale 99); 0 o negativo no hace nada"}
  - {addr: 833, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: por cada lazo que creaste, te deja ese porcentaje de la baba sumada con el compañero. Solo si sos multicelular.", borra: "El motor, en cada ciclo, la uses o no.", rango: "−32000 a 32000; cuenta de 1 a 99 (100 o más vale 99); 0 o negativo no hace nada"}
  - {addr: 834, escribe: "Tu ADN.", lee: "El motor, cuando tu toxina sale hacia quien te atacó: es la celda del atacante donde va a escribir tu [[.pval]] mientras dure el envenenamiento.", borra: "Nadie: es configuración. Un hijo nace con 0.", rango: "−32000 a 32000; sirven 1 a 1000 (un valor mayor se lleva a ese rango, 0 o negativo elige al azar y la 340 no se toca)"}
  - {addr: 835, escribe: "Tu ADN.", lee: "El motor, cuando disparás veneno o lo pasás por un lazo: es la celda de la víctima donde va a escribir tu [[.venval]] mientras dure la parálisis.", borra: "Nadie: es configuración. Un hijo nace con 0.", rango: "−32000 a 32000; sirven 1 a 1000 (un valor mayor se lleva a ese rango, 0 o negativo elige al azar y la 340 no se toca)"}
  - {addr: 836, escribe: "Tu ADN.", lee: "El motor, cuando disparás veneno o lo pasás por un lazo: viaja con el golpe y se escribe en la celda [[.vloc]] de la víctima en cada ciclo de la parálisis.", borra: "Nadie: es configuración. Un hijo nace con 0.", rango: "−32000 a 32000"}
  - {addr: 837, escribe: "El motor, en cada ciclo, en la fase de fuerzas y choques: los ciclos de parálisis que te quedan. Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; vale 0 si no estás paralizado.", rango: "0 a 32000"}
  - {addr: 838, escribe: "El motor, en cada ciclo, en la fase de fuerzas y choques: los ciclos de envenenamiento que te quedan. Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; vale 0 si no estás envenenado.", rango: "0 a 32000"}
  - {addr: 839, escribe: "Tu ADN.", lee: "El motor, cuando tu toxina sale hacia quien te atacó: viaja con ella y se escribe en la celda [[.ploc]] del atacante en cada ciclo del envenenamiento.", borra: "Nadie: es configuración. Un hijo nace con 0.", rango: "−32000 a 32000"}
  - {addr: 330, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: si un bot está a tiro, intenta atarte a él y el número queda como puerto del lazo. Cobra energía, salga o no (parámetro [[param:cost:22]]).", borra: "El motor, siempre que era distinta de 0, salga o no el lazo.", rango: "−32000 a 32000; 0 no es una orden"}
  - {addr: 331, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: fija la rigidez del lazo elegido con [[.tienum]] (o el de [[.tiepres]]), en los dos extremos. Solo lazos endurecidos de un multicelular.", borra: "El motor, después de usarla. Si no tenés lazos, o [[.tienum]] y [[.tiepres]] valen 0, queda escrita.", rango: "−32000 a 32000; cuenta de 1 a 100 (el resto de dividir por 100; un múltiplo de 100 vale 100 y un negativo vale 1); 0 no es una orden"}
  - {addr: 450, escribe: "El motor, en la fase de acciones: el ángulo hacia el compañero del lazo de [[.tiepres]], o 0 si no hay. Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; escribir en ella no cambia nada.", rango: "−628 a 628 (media vuelta para cada lado)"}
  - {addr: 451, escribe: "El motor, en la fase de acciones: el largo de borde a borde del lazo de [[.tiepres]], o 0 si no hay. Lo leés en el ciclo siguiente.", borra: "El motor la recalcula en cada ciclo; escribir en ella no cambia nada.", rango: "desde unos −240 (bots superpuestos) hasta 32000"}
  - {addr: 452, escribe: "Tu ADN.", lee: "El motor. Con 1 a 1000, en la fase de fuerzas y choques escribe [[.tieval]] en esa celda del bot atado (exige [[.tienum]] distinto de 0). Con `-1`, `-3`, `-4` o `-6`, transfiere en la fase de movimiento.", borra: "El motor, junto con [[.tieval]], cuando cumple la orden. Una escritura sin lazo con ese puerto queda escrita; una transferencia también, si no tenés lazos o no hay lazo elegido.", rango: "−32000 a 32000; sirven 1 a 1000 y `-1`, `-3`, `-4` y `-6`"}
  - {addr: 453, escribe: "Tu ADN.", lee: "El motor, junto con [[.tieloc]]: es el número que se escribe en el otro bot, o la cantidad que se transfiere (positiva da, negativa saca).", borra: "El motor, junto con [[.tieloc]], cuando la orden se cumple.", rango: "−32000 a 32000; las transferencias tienen tope por ciclo (ver [[.tieloc]])"}
  - {addr: 454, escribe: "El motor, al formarse un lazo tuyo: el número que pusiste en [[.tie]], o su número de orden si te ataron. Si se corta ese lazo, pasa al anterior de tu lista.", borra: "El motor, cuando se corta el lazo que señalaba y no hay uno anterior en tu lista. Si la escribís vos, tu valor queda.", rango: "−32000 a 32000 (el puerto); 0 es «ningún lazo elegido»"}
  - {addr: 455, escribe: "Tu ADN.", lee: "El motor, en el mismo ciclo: elige por su puerto el lazo de [[.tieloc]], [[.fixang]], [[.fixlen]] y [[.stifftie]]. Con 0 se usa el de [[.tiepres]], salvo para escribir en el otro con [[.tieloc]] positivo.", borra: "El motor, en cada ciclo, en la fase de movimiento. Si no tenés ningún lazo, queda escrita.", rango: "−32000 a 32000; 0 es «el de [[.tiepres]]»"}
  - {addr: 466, escribe: "El motor, cuando se forma o se corta un lazo y en cada ciclo al revisar tus lazos (fase de movimiento).", borra: "El motor, cuando te quedás sin lazos. Escribir en ella no cambia nada.", rango: "0 a 9"}
  - {addr: 467, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: corta, de los dos lados, tu lazo con ese puerto.", borra: "El motor, después de usarla. Si no tenés ningún lazo, queda escrita.", rango: "−32000 a 32000; 0 no es una orden"}
  - {addr: 468, escribe: "Tu ADN. Un hijo nace con 32000, que significa «sin orden».", lee: "El motor, en la fase de movimiento: con 0 o más fija el ángulo del lazo elegido (tomado módulo 1256); con un negativo lo suelta. Solo lazos endurecidos.", borra: "El motor la vuelve a 32000, no a 0, después de usarla. Si no tenés lazos, o [[.tienum]] y [[.tiepres]] valen 0, queda escrita.", rango: "−32000 a 32000; 32000 es «sin orden»"}
  - {addr: 469, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento: el lazo elegido pasa a tener ese largo natural, de borde a borde y sin signo, en los dos extremos. Solo lazos endurecidos.", borra: "El motor, después de usarla; el largo nuevo queda. Si no tenés lazos, o [[.tienum]] y [[.tiepres]] valen 0, queda escrita.", rango: "−32000 a 32000; se toma sin signo y 0 no hace nada"}
  - {addr: 470, escribe: "El motor: 1 cuando uno de tus lazos se endurece (fase de fuerzas y choques); 0 cuando te quedás sin lazos (fase de movimiento).", borra: "El motor, cuando te quedás sin ningún lazo. Escribir en ella no cambia nada.", rango: "0 o 1"}
  - {addr: 471, escribe: "Tu ADN.", lee: "El motor, al final de la fase de fuerzas y choques: elige por su puerto de qué lazo salen las celdas tref*. Con 0 se usa el de [[.tiepres]].", borra: "Nadie: queda hasta que la cambies. Un hijo nace con 0.", rango: "−32000 a 32000; 0 es «el de [[.tiepres]]»"}
  - {addr: 480, escribe: "Tu ADN y el motor. Escribirla con [[op:store]] (u otro store de dos operandos) fija el ángulo del primer lazo en la fase de movimiento; después el motor escribe el ángulo medido, que leés en el ciclo siguiente.", borra: "El motor la reescribe en cada ciclo, solo si sos multicelular, el primer lazo está endurecido y [[.tienum]] o [[.tiepres]] no valen 0.", rango: "0 a 1256"}
  - {addr: 481, escribe: "Tu ADN y el motor, como en [[.tieang1]], para el segundo lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tieang1]].", rango: "0 a 1256"}
  - {addr: 482, escribe: "Tu ADN y el motor, como en [[.tieang1]], para el tercer lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tieang1]].", rango: "0 a 1256"}
  - {addr: 483, escribe: "Tu ADN y el motor, como en [[.tieang1]], para el cuarto lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tieang1]].", rango: "0 a 1256"}
  - {addr: 484, escribe: "Tu ADN y el motor. Escribirla con [[op:store]] (u otro store de dos operandos) fija el largo natural del primer lazo, con signo, en la fase de movimiento; después el motor escribe el largo medido, que leés en el ciclo siguiente.", borra: "El motor la reescribe en cada ciclo, solo si sos multicelular, el primer lazo está endurecido y [[.tienum]] o [[.tiepres]] no valen 0.", rango: "desde unos −240 (bots superpuestos) hasta 32000"}
  - {addr: 485, escribe: "Tu ADN y el motor, como en [[.tielen1]], para el segundo lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tielen1]].", rango: "desde unos −240 (bots superpuestos) hasta 32000"}
  - {addr: 486, escribe: "Tu ADN y el motor, como en [[.tielen1]], para el tercer lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tielen1]].", rango: "desde unos −240 (bots superpuestos) hasta 32000"}
  - {addr: 487, escribe: "Tu ADN y el motor, como en [[.tielen1]], para el cuarto lazo.", borra: "El motor la reescribe en cada ciclo, con las mismas condiciones que [[.tielen1]].", rango: "desde unos −240 (bots superpuestos) hasta 32000"}
