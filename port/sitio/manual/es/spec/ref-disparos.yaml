# Fichas en castellano llano: lo que se ve (ref*) y disparos (shoot, shootval, sabores de disparo, backshot, aimshoot)
registros:
  - {addr: 7, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: si no es 0 y te queda energía, dispara.", borra: "El motor, siempre, en la fase de acciones, haya salido el tiro o no.", rango: "−32000 a 32000. Disparan −1, −2, −3, −4, −6, −8 y los positivos, de memoria, módulo 1000 (un múltiplo exacto de 1000 da esperma). Los demás negativos no hacen nada."}
  - {addr: 8, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones, si [[.shoot]] no es 0: ajusta ese disparo.", borra: "El motor, en la fase de acciones, siempre que [[.shoot]] no es 0, aunque el tiro no salga. Si no disparás, queda puesta.", rango: "−32000 a 32000."}
  - {addr: 202, escribe: "El motor, en la fase de los disparos, cuando te pega uno: su tipo. Si te pegan varios, queda el último. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−8 a −1 según el tipo, o 1 a 1000 si fue de memoria; 0 si no te pegó nada."}
  - {addr: 209, escribe: "El motor, en la fase de los disparos, cuando te pega uno: el ángulo desde donde llegó, medido desde tu frente hacia la derecha. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 1256 (una vuelta): 314 es la derecha, 628 atrás, 942 la izquierda; de frente, cerca de 0 o de 1256."}
  - {addr: 210, escribe: "El motor, en la fase de los disparos, cuando te pega uno por adelante: su tipo, como en [[.shflav]]. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−8 a −1 según el tipo, o 1 a 1000 si fue de memoria; 0 si no te pegó nada por adelante."}
  - {addr: 211, escribe: "El motor, en la fase de los disparos, cuando te pega uno por atrás: su tipo, como en [[.shflav]]. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−8 a −1 según el tipo, o 1 a 1000 si fue de memoria; 0 si no te pegó nada por atrás."}
  - {addr: 212, escribe: "El motor, en la fase de los disparos, cuando te pega uno por la derecha: su tipo, como en [[.shflav]]. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−8 a −1 según el tipo, o 1 a 1000 si fue de memoria; 0 si no te pegó nada por la derecha."}
  - {addr: 213, escribe: "El motor, en la fase de los disparos, cuando te pega uno por la izquierda: su tipo, como en [[.shflav]]. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−8 a −1 según el tipo, o 1 a 1000 si fue de memoria; 0 si no te pegó nada por la izquierda."}
  - {addr: 477, escribe: "El motor, en la fase de acciones de cada ciclo: 1 si el bot que ve tu ojo con foco está anclado con [[.fixpos]], o si la forma que ve está quieta. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 o 1."}
  - {addr: 685, escribe: "El motor, en la fase de acciones de cada ciclo: 0 si tu ojo con foco ve un bot, 1 si ve una forma. En la de fuerzas y choques, 1 si chocás con una forma sin ver nada. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 o 1; también vale 0 cuando no ves nada."}
  - {addr: 686, escribe: "El motor, en la fase de acciones de cada ciclo: 1 si el bot que ve tu ojo con foco es parte de un multibot. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 o 1."}
  - {addr: 687, escribe: "El motor, en la fase de acciones de cada ciclo, con el caparazón ([[.shell]]) del bot que ve tu ojo con foco. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 32000."}
  - {addr: 688, escribe: "El motor, en la fase de acciones de cada ciclo, con el [[.body]] del bot que ve tu ojo con foco, incluso si es un cadáver. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 32000."}
  - {addr: 689, escribe: "El motor, en la fase de acciones de cada ciclo, con la x que publicó el bot que ve tu ojo con foco; con una forma, un punto de ella. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 31999, en las mismas unidades que [[.xpos]]."}
  - {addr: 690, escribe: "El motor, en la fase de acciones de cada ciclo, con la y que publicó el bot que ve tu ojo con foco; con una forma, un punto de ella. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 31999, en las mismas unidades que [[.ypos]]; crece hacia abajo."}
  - {addr: 695, escribe: "El motor, en la fase de acciones de cada ciclo: qué tan rápido se mueve lo que ve tu ojo con foco respecto de vos, sin importar hacia dónde. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "0 a 32000; nunca es negativa."}
  - {addr: 696, escribe: "El motor, en la fase de acciones de cada ciclo: es [[.refveldx]] con el signo cambiado, positiva si lo que ves se va hacia tu izquierda. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−32000 a 32000.", nota: "En el DarwinBots original valía siempre 0. El port la corrigió."}
  - {addr: 697, escribe: "El motor, en la fase de acciones de cada ciclo: la velocidad de costado de lo que ve tu ojo con foco, menos tu [[.veldx]]. Positiva, hacia tu derecha. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−32000 a 32000."}
  - {addr: 698, escribe: "El motor, en la fase de acciones de cada ciclo: es [[.refvel]] con el signo cambiado, positiva si lo que ves se te acerca. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−32000 a 32000."}
  - {addr: 699, escribe: "El motor, en la fase de acciones de cada ciclo: la velocidad de lo que ve tu ojo con foco en tu dirección de mirada, menos tu [[.velup]]. Positiva si se aleja. También al chocar con un bot. Lo leés en el ciclo siguiente.", borra: "El motor, cada ciclo, cuando se borran los sentidos.", rango: "−32000 a 32000."}
