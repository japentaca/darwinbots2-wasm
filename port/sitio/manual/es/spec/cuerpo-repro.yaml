# Fichas en castellano llano: cuerpo, energía, desechos, cloroplastos, reproducción, virus y genes
registros:
  - {addr: 9, escribe: "El motor, en la fase de acciones: la edad del bot. Pisa lo que escribas. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000: 0 en el primer ciclo de vida; al llegar a 32000 se queda ahí."}
  - {addr: 10, escribe: "El motor, en la fase de movimiento, antes de las compras y conversiones de la fase de acciones. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "1 a 32000; sale del cuerpo, el caparazón y sobre todo los cloroplastos.", nota: "Un bot recién cargado la lee en 0 en su primer ciclo."}
  - {addr: 12, escribe: "El motor le suma 1 en la fase de acciones; después de 32000 sigue en −32000. Tu ADN también puede escribirlo. Al cargar arranca al azar y el hijo lo hereda.", borra: "No: el motor nunca lo pone en 0.", rango: "−32000 a 32000."}
  - {addr: 220, escribe: "El motor, solo cuando este bot mata a otro: con un disparo, en la fase de los disparos; por un lazo, en la de movimiento.", borra: "No. Si escribís otro número, queda hasta la próxima muerte; ahí el motor vuelve a poner su propia cuenta.", rango: "0 a 32000."}
  - {addr: 300, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones: si es mayor que 0, pide un hijo, que nace en la de nacimientos y muertes del mismo ciclo.", borra: "El motor, solo cuando nace el hijo. Si el parto falla, sigue escrita y se reintenta cada ciclo.", rango: "−32000 a 32000; se usa el resto de dividir por 100: el porcentaje que se lleva el hijo (100 vale 0)."}
  - {addr: 301, escribe: "Tu ADN.", lee: "El motor, igual que [[.repro]]; además el hijo muta al nacer con probabilidades diez veces más altas que las normales.", borra: "El motor, solo cuando nace el hijo. Si el parto falla, sigue escrita.", rango: "−32000 a 32000; se usa el resto de dividir por 100."}
  - {addr: 302, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones, si es mayor que 0 y el bot está fecundado: pide un hijo sexual con ese porcentaje. Ese ciclo, [[.repro]] espera.", borra: "El motor, solo cuando nace el hijo. Si el parto falla, sigue escrita.", rango: "−32000 a 32000; se usa el resto de dividir por 100."}
  - {addr: 303, escribe: "El motor la pone en 10 cuando llega un esperma, en la fase de los disparos, y la baja de a 1 en la de acciones.", borra: "El motor, cuando vence la fecundación y después de un parto sexual. Si rechaza el esperma, queda congelada.", rango: "0 a 10; en la práctica leés 9 el ciclo siguiente al esperma y después baja hasta 0.", nota: "Escribirla no fecunda al bot. Fuera de una fecundación el motor no la toca: lo que escribas queda ahí."}
  - {addr: 310, escribe: "El motor, en la fase de acciones; también al nacer, para el padre y el hijo. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000; por dentro puede quedar negativa, pero nunca la leés así.", nota: "Un bot recién cargado la lee en 0 en su primer ciclo; un hijo, en cambio, nace con su energía publicada."}
  - {addr: 311, escribe: "El motor, en la fase de acciones, después de las conversiones de [[.strbody]] y [[.fdbody]]; también al parir, para el padre. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000.", nota: "En su primer ciclo de vida el bot la lee en 0, tanto si lo cargaste como si acaba de nacer."}
  - {addr: 312, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: saca esa energía del cuerpo, a 10 de energía por punto.", borra: "El motor, después de usarla. Un valor negativo también se borra, sin efecto.", rango: "−32000 a 32000; solo cuentan de 1 a 100 (más de 100 vale 100)."}
  - {addr: 313, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: pasa esa energía al cuerpo, 1 de cuerpo por cada 10. No mira si te alcanza.", borra: "El motor, después de usarla. Un valor negativo también se borra, sin efecto.", rango: "−32000 a 32000; solo cuentan de 1 a 100 (más de 100 vale 100)."}
  - {addr: 314, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo, si no es 0: suma el valor dividido por 32000 a la flotabilidad, que queda entre 0 y 1.", borra: "El motor, después de usarla.", rango: "−32000 a 32000; 32000 recorre la flotabilidad entera, de 0 a 1."}
  - {addr: 315, escribe: "El motor, en la fase de acciones, solo en los ciclos en que [[.setboy]] no es 0. La leés en el ciclo siguiente.", borra: "No: conserva el último valor hasta el próximo [[.setboy]].", rango: "0 a 32000: la flotabilidad de 0 a 1.", nota: "Un hijo hereda la flotabilidad del padre, pero lee 0 hasta que escribe [[.setboy]] por primera vez."}
  - {addr: 335, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento del mismo ciclo: si no hay virus, copia ese gen en uno y cobra [[param:cost:25]] por palabra. Si el bot tiene cloroplastos, los pierde y no fabrica.", borra: "El motor, recién cuando dispara el virus; mientras incuba, la celda conserva el número del gen.", rango: "−32000 a 32000; solo vale el número de un gen que exista."}
  - {addr: 336, escribe: "El motor, cada ciclo en la fase de movimiento, y también al cargar el bot, al nacer, al mutar, al borrar un gen o al recibir un virus.", borra: "No: el motor la reescribe cada ciclo, así que escribirle no sirve.", rango: "1 a 32001: las palabras del ADN más el end final."}
  - {addr: 337, escribe: "El motor, cada ciclo en la fase de movimiento. La publica antes de fabricar, así que el ciclo siguiente a [[.mkvirus]] todavía leés 0.", borra: "No: el motor la reescribe cada ciclo; vuelve a 0 al disparar el virus.", rango: "0 a 32000: 0 sin virus, más de 1 incubando, 1 listo para disparar."}
  - {addr: 338, escribe: "Tu ADN. Un valor negativo se toma como 1.", lee: "El motor, en la fase de movimiento: si no es 0 y [[.vtimer]] vale 1, dispara el virus con esa fuerza.", borra: "El motor, al disparar. Si el virus no está listo, la orden queda escrita hasta que lo esté.", rango: "−32000 a 32000: la fuerza del disparo."}
  - {addr: 339, escribe: "El motor, cada ciclo en la fase de movimiento, y también al cargar el bot, al nacer, al mutar, al borrar un gen o al recibir un virus.", borra: "No: el motor la reescribe cada ciclo, así que escribirle no sirve.", rango: "0 a 32000."}
  - {addr: 340, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento del mismo ciclo: si es mayor que 0, borra ese gen.", borra: "El motor, después de usarla. Un valor negativo no hace nada y queda escrito.", rango: "−32000 a 32000; solo vale el número de un gen que exista.", nota: "Ningún ataque de afuera puede escribirla: los disparos de memoria la saltean y el veneno no puede apuntarle."}
  - {addr: 341, escribe: "El motor, mientras corre el ADN, cada vez que pasa por un cond, start, else o stop.", borra: "No: el motor la pisa en el próximo marcador de gen.", rango: "0 hasta la cantidad de genes del bot."}
  - {addr: 828, escribe: "El motor, en la fase de acciones; si pasaban de 32000, después de expulsarlos. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000."}
  - {addr: 829, escribe: "El motor, en la fase de acciones. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo, y nunca baja salvo al reproducirse.", rango: "0 a 32000."}
  - {addr: 920, escribe: "El motor, en la fase de acciones, después de las compras, las bajas y la pérdida natural del ciclo. La leés en el ciclo siguiente.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000.", nota: "Un bot recién cargado la lee en 0 en su primer ciclo, aunque sea un vegetal."}
  - {addr: 921, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: suma esos cloroplastos y cobra [[param:cost:8]] por cada uno. Si le quedarían menos de 100 de energía, no compra nada.", borra: "El motor, después de usarla. Un valor negativo no hace nada y queda escrito, salvo que ese ciclo se use [[.rmchlr]].", rango: "−32000 a 32000; solo cuentan los positivos."}
  - {addr: 922, escribe: "Tu ADN.", lee: "El motor, en la fase de acciones del mismo ciclo: quita esos cloroplastos, sin cobrar ni devolver energía.", borra: "El motor, después de usarla. Un valor negativo no hace nada y queda escrito, salvo que ese ciclo se use [[.mkchlr]].", rango: "−32000 a 32000; solo cuentan los positivos."}
  - {addr: 923, escribe: "El motor, en la fase de acciones: la parte del campo que no tapan los bots. Solo se recalcula de día; de noche repite el último valor.", borra: "No: el motor la reescribe cada ciclo.", rango: "0 a 32000: 32000 es un campo vacío.", nota: "Un bot recién cargado la lee en 0 en su primer ciclo."}
  - {addr: 924, escribe: "Tu ADN.", lee: "El motor, en la fase de movimiento del mismo ciclo, solo en un organismo multicelular: reparte con cada lazo que creó este bot.", borra: "El motor, cada ciclo en la fase de movimiento, en todos los bots.", rango: "−32000 a 32000; solo cuentan de 1 a 99 (más de 99 vale 99)."}
