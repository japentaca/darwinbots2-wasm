  costs: {SHOTCOST: 2, COSTSTORE: 0.04, CONDCOST: 0.004, MOVECOST: 0.05, TIECOST: 2, VENOMCOST: 0.01, POISONCOST: 0.01, SLIMECOST: 0.1, SHELLCOST: 0.1, COSTMULTIPLIER: 1, BODYUPKEEP: 0.00001, AGECOST: 0.01, CHLRCOST: 0.2, resto: 0}
  mundo: {FieldWidth: 9237, FieldHeight: 6928, Toroidal: true, MaxEnergy: 40, MaxPopulation: 25, MinVegs: 10, RepopAmount: 10, RepopCooldown: 25, MaxVelocity: 180, VegFeedingToBody: 0.5, BadWastelevel: 10000, PhysBrown: 0, Zgravity: 2, CoefficientStatic: 0.6, CoefficientKinetic: 0.4, Viscosity: 0, Density: 0, CoefficientElasticity: 0, Ygravity: 0, EnergyExType: true, EnergyProp: 1, CorpseEnabled: false, DayNight: false, SunOnRnd: true, DynamicCosts: false}
  nota: "mutaciones deshabilitadas para todas las especies; la liga historica corrio contra esto"

arranque: # sembrado antes de leer settings; lastexit.set puede pisar todo
  mdiform: {chartingInterval: 200, FieldWidth: 16000, FieldHeight: 12000, MaxVelocity: 60, DYNAMICCOSTSENSITIVITY: 50, BOTNOCOSTLEVEL: -1, COSTMULTIPLIER: 1, VegFeedingToBody: 0.75, Gradient: 1.02, BadWastelevel: -1, PhysMoving: 0.66, EnergyExType: true, EnergyFix: 200, EnergyProp: 1, MaxEnergy: 100, MaxPopulation: 100, MinVegs: 50, RepopAmount: 10, RepopCooldown: 10, PhysBrown: 0.5, SunUpThreshold: 500000, SunDownThreshold: 1000000, FluidSolidCustom: 2, CostRadioSetting: 2}
  cite_mdiform: "MDIForm1.frm:2461-2510"
  globales: {bodyfix: 32100, UseSafeMode: true, UseEpiGene: false, UseIntRnd: false, intFindBestV2: 100, epiresetemp: 1.3, epiresetOP: 17, Delta2: false, DeltaMainExp: 1, DeltaMainLn: 0, DeltaDevExp: 7, DeltaDevLn: 1, DeltaPM: 3000, DeltaWTC: 15, DeltaMainChance: 100, DeltaDevChance: 30, NormMut: false, valNormMut: 1071, valMaxNormMut: 1071, y_hidePredCycl: 1500, y_LFOR: 10, y_zblen: 255}
  cite_globales: "HDRoutines.bas:852-887"
  ui: {StartChlr_default: 16000, cite: "frmGset.frm:1481-1557"}
  nota: "sunbelt/epireset/FudgeEyes/FudgeAll/Disqualify/StartChlr llegan de Global.gset o la UI; sin archivo, los Boolean quedan False y StartChlr 0 (VB6 default) — [SIN VERIFICAR] el .gset distribuido con el instalador"
