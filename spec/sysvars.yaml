     escribe: ADN, lee: "VoluntaryForces P1", borra: "UpdatePosition P3", rango: "+-32000", cite: "DNATokenizing.bas:874-875; Robots.bas:867"}
  - {addr: 5, names: [aimdx, aimright], const: aimdx, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "SetAimFunc P3 (Robots.bas:779)", borra: "SetAimFunc P3 =0 (:818)", rango: "+-32000", cite: "DNATokenizing.bas:877-881"}
  - {addr: 6, names: [aimsx, aimleft], const: aimsx, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "SetAimFunc P3 (Robots.bas:779)", borra: "SetAimFunc P3 =0 (:817)", rango: "+-32000", cite: "DNATokenizing.bas:883-887"}
  - {addr: 7, names: [shoot], const: shoot, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "Shooting P5: si <>0 llama robshoot (Robots.bas:1213,1729)",
     borra: "Shooting P5 =0 siempre (:1214) y robshoot al salir (:1862)", rango: "+-32000; robshoot: >=0 => shot de memoria Mod 1000, <0 => Mod 8 (Shots.bas:120,1786)", cite: "Robots.bas:1211-1215"}
  - {addr: 8, names: [shootval], const: shootval, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "robshoot (Robots.bas:1730)",
     borra: "solo cuando robshoot corre (:1863); si el bot nunca dispara, PERSISTE", rango: "+-32000", cite: "Robots.bas:1716-1864"}
  - {addr: 9, names: [robage], const: robage, sentido: sense, in: true, out: false,
     escribe: "Ageing P5 = min(age,32000); pisa lo que escriba el bot cada ciclo", borra: "no (se reescribe)",
     rango: "1..32000 (el primer Ageing del bot escribe 1)", cite: "Robots.bas:1197-1205"}
  - {addr: 10, names: [mass], const: masssys, sentido: sense, in: true, out: false,
     escribe: "UpdatePosition P3 = .mass (Single, redondeo banker)", borra: no,
