     borra: "UpdatePosition P3 =0 tras copiar a lastup (Robots.bas:861-868)", rango: "+-32000", cite: "DNATokenizing.bas:865-866"}
  - {addr: 2, names: [dn], const: dirdn, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "VoluntaryForces P1", borra: "UpdatePosition P3", rango: "+-32000", cite: "DNATokenizing.bas:868-869; Robots.bas:866"}
  - {addr: 3, names: [sx], const: dirsx, sentido: cmd, in: false, out: true,
     escribe: ADN, lee: "VoluntaryForces P1", borra: "UpdatePosition P3", rango: "+-32000", cite: "DNATokenizing.bas:871-872; Robots.bas:868"}
