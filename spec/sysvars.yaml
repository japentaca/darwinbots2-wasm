# sysvars.yaml — mapa de memoria del bot, DarwinBots 2.48.32
# Fuente: commit 02b20d7. Narrativa y casos borde en spec/21-MEMORIA.md.
#
# Convenciones:
#   addr:    direccion en mem(0..1000). mem() es Integer de 16 bits (Robots.bas:265).
#   names:   nombres en la tabla sysvar() de LoadSysVars (DNATokenizing.bas:862-3167),
#            en orden de indice de tabla. Varios nombres = aliases a la misma direccion.
#   const:   constante simbolica del motor en Robots.bas:8-163, si existe.
#   sentido: cmd  = orden del bot al motor (el motor la consume/borra)
#            sense= el motor la escribe para que el ADN la lea
#            bidi = entrada y salida a la vez
#            int  = interna del motor (pinned: el motor la reescribe cada ciclo)
#            free = sin interaccion del motor (memoria libre con nombre)
#   in/out:  presencia (activa, no comentada) en sysvarIN()/sysvarOUT(), las tablas
#            "informational"/"functional" que solo usan las mutaciones ChangeDNA2
#            (NeoMutations.bas:607-676) para elegir objetivos. El interprete no las usa.
#   escribe: quien escribe y en que punto del tick (nomenclatura de 10-CICLO.md:
#            paso 10 ADN, paso 12 EraseSenses, paso 14 updateshots, paso 16 = UpdateBots
#            con pasadas P1..P6, paso 21 feedvegs).
#   borra:   quien la pone a 0 (o a su centinela) y cuando.
#   rango:   valores que el motor puede dejar. El interprete siempre escribe mod32000
#            (+-32000, 20-VM.md par.7).
#   Latencia por defecto: los sentidos escritos en el ciclo N (P1/paso 14/P5) los lee el
#   ADN en N+1 (el ADN corre en el paso 10, antes de todo eso; 10-CICLO.md par.2).
#   Los comandos escritos por el ADN en el paso 10 se consumen en el MISMO ciclo
#   (P1/P3/P5). Excepciones anotadas por registro.

meta:
  declaracion: "mem(1000) As Integer — 1001 celdas, 0..1000 (Robots.bas:265)"
  direccionamiento_adn: "Abs(x) Mod 1000, 0->1000: el ADN solo alcanza 1..1000; mem(0) inalcanzable (20-VM.md par.0.6)"
  tabla_sysvar: "sysvar(1000) As var (DNA.bas:25), cargada por LoadSysVars (DNATokenizing.bas:862); entradas 1..255 usadas"
  tablas_in_out:
    que_son: "sysvarIN(255)/sysvarOUT(255) (DNA.bas:27-28), cargadas en LoadSysVars con subconjuntos de la tabla principal (IN: sensores; OUT: comandos; entradas no aplicables comentadas)"
    unico_consumidor: "ChangeDNA2 (PointMutation2/CopyError2): sysvarOUT para generar pares 'numero store' (NeoMutations.bas:645-659) y .tieloc/.shoot/.focuseye especiales (:613-637); sysvarIN para generar lecturas *n (:670-675). El interprete y el resto del motor no las leen."
  persistencia: "mem() completo (incluido mem(0)) se guarda y carga con la simulacion (HDRoutines.bas:2067 Put, :1655 Get). Al guardar un bot suelto con UseEpiGene, mem(971..990) se re-exporta como lineas de ADN 'valor direccion store' (HDRoutines.bas:2274-2282)."
  al_nacer: "Erase rob(nuovo).mem — todo a 0 (Robots.bas:2180); despues el motor siembra: mem(19)=aim*200 (:2195), mem(468)=32000 (:2196), mem(216)=1 si Fixed (:2245), mem(310) (:2232), mem(336)/mem(339) (:2377-2378), mem(12) heredado del padre (:2383), mem(971..975) copiados del padre (:2277-2279). SexReproduce identico (:2644-2817)."
  colisiones_nombre_direccion:
    - "aimdx/aimright->5, aimsx/aimleft->6, velup/vel->200, depth/ypos->217, refvel/refvelup->699, strvenom/mkvenom->824, strpoison/mkpoison->826, light/availability->923 (aliases puros)"
    - "TRAMPA: la const Fixed=216 (Robots.bas:42) corresponde al sysvar 'fixpos'; el sysvar 'fixed' es 215. tieport1=450 colisiona con TIEANG=450 (Robots.bas:82-83)."
  huecos_sin_nombre: # direccionables desde el ADN, persistentes, jamas tocados por el motor salvo altzheimer (aleatorio, Robots.bas:983-998) y los shots de memoria (Shots.bas:357)
    - "13-17, 20-193 (la zona clasica de variables privadas), 222-299, 304-309, 316-329, 332-334, 342-399, 403-409, 430-436, 472, 500 (const EyeStart sin uso), 512-520, 530, 540-684, 691-694, 700 (const occurrstart sin uso), 716-720, 732-799, 840-899, 902-919, 925-970, 991-1000"
    - "971-990 tambien carecen de nombre pero SI los usa el motor (memoria genetica, ver registros)"
  mem_cero:
    escrito_por: "Poisons (P1): .mem(.Vloc)=.Vval / .mem(.Ploc)=.Pval (Robots.bas:1118,1127) cuando Vloc/Ploc=0. Vloc/Ploc quedan en 0 cuando el vloc/ploc del atacante mapea a 340 (proteccion delgene): Shots.bas:804,849; Ties.bas:396,464."
    leido_por: "nadie. Es un sumidero deliberado; se persiste en los saves."
  rng_dependiente_de_memoria: # consumo de rndy condicionado por valores de mem (afecta replays, Q01)
    - "lookoccurr/ReadTRefVars con FudgeEyes/FudgeAll: 1 rndy por campo trucado (Senses.bas:237,242,278-287,299; Ties.bas:743-748,796)"
    - "altzheimer: >=2 rndy por iteracion, con re-tiradas si loc=921/922 (Robots.bas:991-995)"
    - "takeven/takepoison/Ties con vloc/ploc<=0: Random(1,1000) con re-tirada si sale 340 (Shots.bas:806-808,851-853; Ties.bas:398-401,466-469,604-607)"
    - "newshot: Random(-2,2) y Random(-20,20) por disparo (Shots.bas:130,146); Vshoot: Random(1,1256) (:1106); maketie: Random(2,92) (Ties.bas:898); addgene: Random(0,genenum) (Shots.bas:1194)"

registros:
  # --- 0: el sumidero ---
  - {addr: 0, names: [], const: null, sentido: int, in: false, out: false,
     escribe: "Poisons P1 con Vloc/Ploc=0 (exclusion 340)", borra: "nadie; persiste y se guarda",
     rango: "Vval/Pval del atacante (+-32000)", cite: "Robots.bas:1118,1127; Shots.bas:804,849; Ties.bas:396,464; HDRoutines.bas:2067"}

